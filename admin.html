<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SXM Bus - Admin Dashboard</title>


    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         STYLES
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f4f6;
        }


        body {
            overflow: hidden;
        }


        /* =================================================
           HEADER
        ================================================= */

        .header {

            height: 70px;

            background: #111827;

            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            position: relative;

            z-index: 2000;
        }


        .header h1 {

            margin: 0;

            font-size: 22px;
        }


        .header-subtitle {

            margin-top: 4px;

            font-size: 13px;

            color: #cbd5e1;
        }


        #connectionStatus {

            padding: 8px 14px;

            border-radius: 20px;

            background: #374151;

            font-size: 13px;

            font-weight: bold;
        }


        .connected {

            color: #86efac;
        }


        .disconnected {

            color: #fca5a5;
        }


        /* =================================================
           MAIN
        ================================================= */

        .main {

            height: calc(100vh - 70px);

            display: flex;
        }


        /* =================================================
           SIDEBAR
        ================================================= */

        .sidebar {

            width: 350px;

            min-width: 300px;

            background: white;

            border-right: 1px solid #ddd;

            overflow-y: auto;

            padding: 16px;

            position: relative;

            z-index: 1500;
        }


        .section-title {

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 10px;

            color: #111827;
        }


        /* =================================================
           SUMMARY
        ================================================= */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            margin-bottom: 20px;
        }


        .summary-card {

            background: #f9fafb;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            padding: 10px;

            text-align: center;
        }


        .summary-number {

            font-size: 22px;

            font-weight: bold;

            color: #111827;
        }


        .summary-label {

            font-size: 11px;

            color: #6b7280;

            margin-top: 3px;
        }


        /* =================================================
           BUS CARDS
        ================================================= */

        .bus-card {

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            padding: 12px;

            margin-bottom: 10px;

            cursor: pointer;

            background: white;

            transition: background 0.15s;
        }


        .bus-card:hover {

            background: #f8fafc;
        }


        .bus-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 7px;
        }


        .bus-name {

            font-weight: bold;

            font-size: 16px;
        }


        .status-online {

            color: #16a34a;

            font-size: 11px;

            font-weight: bold;
        }


        .status-offline {

            color: #dc2626;

            font-size: 11px;

            font-weight: bold;
        }


        .status-dot {

            display: inline-block;

            width: 9px;

            height: 9px;

            border-radius: 50%;

            margin-right: 5px;
        }


        .dot-online {

            background: #22c55e;
        }


        .dot-offline {

            background: #ef4444;
        }


        .bus-route {

            font-size: 13px;

            color: #374151;

            line-height: 1.4;
        }


        .bus-details {

            margin-top: 7px;

            font-size: 11px;

            color: #6b7280;

            line-height: 1.5;
        }


        /* =================================================
           ROUTES
        ================================================= */

        .route-section {

            margin-top: 25px;
        }


        .route-card {

            border: 1px solid #e5e7eb;

            border-radius: 9px;

            padding: 10px;

            margin-bottom: 7px;

            cursor: pointer;

            background: white;
        }


        .route-card:hover {

            background: #f8fafc;
        }


        .route-name {

            font-size: 13px;

            font-weight: bold;

            color: #111827;
        }


        .route-direction {

            font-size: 12px;

            color: #4b5563;

            margin-top: 3px;
        }


        .route-status {

            font-size: 10px;

            margin-top: 5px;

            font-weight: bold;
        }


        .route-ready {

            color: #16a34a;
        }


        .route-pending {

            color: #d97706;
        }


        .route-error {

            color: #dc2626;
        }


        /* =================================================
           MAP
        ================================================= */

        #map {

            flex: 1;

            height: 100%;
        }


        /* =================================================
           POPUP
        ================================================= */

        .popup {

            font-size: 13px;

            line-height: 1.6;
        }


        .popup-title {

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (
            max-width: 700px
        ) {

            .sidebar {

                width: 280px;

                min-width: 280px;
            }

            .header h1 {

                font-size: 17px;
            }

            .header-subtitle {

                display: none;
            }

        }

    </style>

</head>



<body>


<!-- =======================================================
     HEADER
======================================================== -->

<div class="header">

    <div>

        <h1>
            🚌 SXM BUS — ADMIN
        </h1>

        <div class="header-subtitle">
            Live St. Maarten / St. Martin Transportation
        </div>

    </div>


    <div id="connectionStatus">

        Connecting...

    </div>

</div>



<!-- =======================================================
     MAIN
======================================================== -->

<div class="main">


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <div class="sidebar">


        <!-- SUMMARY -->

        <div class="section-title">
            Fleet Overview
        </div>


        <div class="summary-grid">


            <div class="summary-card">

                <div
                    class="summary-number"
                    id="totalBuses"
                >
                    0
                </div>

                <div class="summary-label">
                    Buses
                </div>

            </div>


            <div class="summary-card">

                <div
                    class="summary-number"
                    id="activeBuses"
                >
                    0
                </div>

                <div class="summary-label">
                    Online
                </div>

            </div>


            <div class="summary-card">

                <div
                    class="summary-number"
                    id="totalRoutes"
                >
                    0
                </div>

                <div class="summary-label">
                    Routes
                </div>

            </div>


        </div>



        <!-- =================================================
             BUSES
        ================================================== -->

        <div class="section-title">

            Live Buses

        </div>


        <div id="busList">

            <div style="
                color:#6b7280;
                font-size:13px;
            ">

                Loading buses...

            </div>

        </div>



        <!-- =================================================
             ROUTES
        ================================================== -->

        <div class="route-section">

            <div class="section-title">

                Routes

            </div>


            <div id="routeList">

                <div style="
                    color:#6b7280;
                    font-size:13px;
                ">

                    Loading routes...

                </div>

            </div>

        </div>


    </div>



    <!-- ===================================================
         MAP
    ==================================================== -->

    <div id="map"></div>


</div>



<!-- =======================================================
     LEAFLET JAVASCRIPT
======================================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin="">
</script>



<script>

/* ==========================================================
   SUPABASE
========================================================== */


const SUPABASE_URL =
    "https://enqyrmpdaxuelqlgevnl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_J_P6bfidx389dnZJc3H43A_vK3ccYnW";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_KEY

    );



/* ==========================================================
   MAP
========================================================== */


const map =
    L.map("map")
        .setView(

            [
                18.0425,
                -63.0548
            ],

            12

        );


L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 19,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

).addTo(map);



/* ==========================================================
   DATA STORAGE
========================================================== */


const busMarkers = {};

const routeLayers = {};

const routeStatus = {};

let allRoutes = [];



/* ==========================================================
   BUS ICON
========================================================== */


const busIcon =
    L.divIcon({

        className: "",

        html: `

            <div style="
                width:42px;
                height:42px;
                border-radius:50%;
                background:white;
                border:2px solid #111827;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:25px;
                box-shadow:0 2px 8px rgba(0,0,0,0.25);
            ">

                🚌

            </div>

        `,

        iconSize: [
            42,
            42
        ],

        iconAnchor: [
            21,
            21
        ]

    });



/* ==========================================================
   ESCAPE HTML
========================================================== */


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==========================================================
   ROUTE COLORS
========================================================== */


function getRouteColor(index) {

    const colors = [

        "#2563eb",
        "#dc2626",
        "#16a34a",
        "#9333ea",
        "#ea580c",
        "#0891b2",
        "#db2777",
        "#65a30d",
        "#7c3aed",
        "#ca8a04"

    ];

    return colors[
        index % colors.length
    ];

}



/* ==========================================================
   CONVERT ROUTE POINTS
========================================================== */


function getRouteCoordinates(route) {

    if (
        !Array.isArray(
            route.route_points
        )
    ) {

        return [];

    }


    return route.route_points

        .map(point => {

            const lat =
                Number(point.lat);

            const lng =
                Number(point.lng);


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ) {

                return null;

            }


            return [
                lat,
                lng
            ];

        })

        .filter(Boolean);

}



/* ==========================================================
   GET ROAD ROUTE FROM OSRM
========================================================== */


async function getRoadGeometry(points) {


    if (
        points.length < 2
    ) {

        return null;

    }


    const coordinates =
        points
            .map(
                point =>
                    `${point[1]},${point[0]}`
            )
            .join(";");


    const url =
        "https://router.project-osrm.org/route/v1/driving/" +
        coordinates +
        "?overview=full&geometries=geojson&steps=false";


    try {

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "OSRM request failed"
            );

        }


        const result =
            await response.json();


        if (
            !result.routes ||
            result.routes.length === 0
        ) {

            throw new Error(
                "No road route returned"
            );

        }


        return result
            .routes[0]
            .geometry
            .coordinates
            .map(
                coordinate => [

                    coordinate[1],

                    coordinate[0]

                ]
            );


    } catch (error) {

        console.error(
            "Road geometry error:",
            error
        );

        return null;

    }

}



/* ==========================================================
   DRAW ROUTE
========================================================== */


async function drawRoute(route, index) {


    const anchorPoints =
        getRouteCoordinates(route);


    if (
        anchorPoints.length < 2
    ) {

        routeStatus[
            route.id
        ] = "pending";

        return;

    }


    const color =
        getRouteColor(index);


    // Draw temporary anchor line first

    const temporaryLine =
        L.polyline(

            anchorPoints,

            {

                color:
                    color,

                weight: 3,

                opacity: 0.35,

                dashArray: "6,6"

            }

        ).addTo(map);


    routeLayers[
        route.id
    ] = temporaryLine;


    // Try to obtain actual road geometry

    const roadPoints =
        await getRoadGeometry(
            anchorPoints
        );


    if (
        roadPoints &&
        roadPoints.length > 1
    ) {


        // Remove temporary line

        map.removeLayer(
            temporaryLine
        );


        const roadLine =
            L.polyline(

                roadPoints,

                {

                    color:
                        color,

                    weight: 5,

                    opacity: 0.75

                }

            ).addTo(map);


        roadLine.bindPopup(`

            <div class="popup">

                <strong>
                    ${escapeHtml(
                        route.route_name
                    )}
                </strong>

                <br>

                ${escapeHtml(
                    route.direction
                )}

            </div>

        `);


        routeLayers[
            route.id
        ] = roadLine;


        routeStatus[
            route.id
        ] = "ready";


    } else {


        // Keep anchor line

        temporaryLine.setStyle({

            opacity: 0.45,

            dashArray: "8,8"

        });


        temporaryLine.bindPopup(`

            <div class="popup">

                <strong>
                    ${escapeHtml(
                        route.route_name
                    )}
                </strong>

                <br>

                ${escapeHtml(
                    route.direction
                )}

                <br><br>

                Road routing unavailable.
                Showing route anchors.

            </div>

        `);


        routeStatus[
            route.id
        ] = "fallback";

    }


    refreshRouteCards();

}



/* ==========================================================
   LOAD ROUTES
========================================================== */


async function loadRoutes() {


    const {
        data,
        error
    } =
        await supabaseClient

            .from("routes")

            .select("*")

            .eq(
                "active",
                true
            )

            .order(
                "route_name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Routes error:",
            error
        );


        document.getElementById(
            "routeList"
        ).innerHTML = `

            <div style="
                color:#dc2626;
                font-size:13px;
            ">

                ❌ Could not load routes

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        return;

    }


    allRoutes =
        data || [];


    document.getElementById(
        "totalRoutes"
    ).innerText =
        allRoutes.length;


    allRoutes.forEach(
        (route, index) => {

            drawRoute(
                route,
                index
            );

        }
    );


    refreshRouteCards();

}



/* ==========================================================
   ROUTE CARDS
========================================================== */


function refreshRouteCards() {


    const routeList =
        document.getElementById(
            "routeList"
        );


    routeList.innerHTML = "";


    if (
        allRoutes.length === 0
    ) {

        routeList.innerHTML = `

            <div style="
                color:#6b7280;
                font-size:13px;
            ">

                No routes found.

            </div>

        `;

        return;

    }


    allRoutes.forEach(
        route => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "route-card";


            const points =
                getRouteCoordinates(
                    route
                );


            let statusText =
                "⚠ No route geometry";


            let statusClass =
                "route-pending";


            if (
                routeStatus[
                    route.id
                ] === "ready"
            ) {

                statusText =
                    "✓ Road route mapped";

                statusClass =
                    "route-ready";

            }


            else if (
                routeStatus[
                    route.id
                ] === "fallback"
            ) {

                statusText =
                    "⚠ Using anchor points";

                statusClass =
                    "route-pending";

            }


            else if (
                points.length >= 2
            ) {

                statusText =
                    "⏳ Mapping roads...";

                statusClass =
                    "route-pending";

            }


            card.innerHTML = `

                <div class="route-name">

                    ${escapeHtml(
                        route.route_name
                    )}

                </div>


                <div class="route-direction">

                    ${escapeHtml(
                        route.direction
                    )}

                </div>


                <div class="route-status ${
                    statusClass
                }">

                    ${statusText}

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    focusRoute(
                        route
                    );

                }
            );


            routeList.appendChild(
                card
            );

        }
    );

}



/* ==========================================================
   FOCUS ROUTE
========================================================== */


function focusRoute(route) {


    const layer =
        routeLayers[
            route.id
        ];


    if (
        layer
    ) {

        map.fitBounds(
            layer.getBounds(),
            {
                padding: [
                    30,
                    30
                ]
            }
        );


        layer.openPopup();

        return;

    }


    const points =
        getRouteCoordinates(
            route
        );


    if (
        points.length >= 2
    ) {

        map.fitBounds(
            L.latLngBounds(
                points
            ),
            {
                padding: [
                    30,
                    30
                ]
            }
        );

    }

}



/* ==========================================================
   LOAD LIVE BUS LOCATIONS
========================================================== */


async function loadBusLocations() {


    const {
        data,
        error
    } =
        await supabaseClient

            .from("bus_locations")

            .select("*");


    const connectionStatus =
        document.getElementById(
            "connectionStatus"
        );


    if (error) {


        console.error(
            "Bus database error:",
            error
        );


        connectionStatus.innerHTML =
            "🔴 Database Error";


        connectionStatus.className =
            "disconnected";


        return;

    }


    connectionStatus.innerHTML =
        "🟢 Connected";


    connectionStatus.className =
        "connected";


    const buses =
        data || [];


    document.getElementById(
        "totalBuses"
    ).innerText =
        buses.length;


    const busList =
        document.getElementById(
            "busList"
        );


    busList.innerHTML = "";


    let activeCount = 0;


    const currentlyVisibleBuses = {};


    buses.forEach(
        bus => {


            const lat =
                Number(
                    bus.latitude
                );


            const lng =
                Number(
                    bus.longitude
                );


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ) {

                return;

            }


            currentlyVisibleBuses[
                bus.bus_id
            ] = true;


            // Determine GPS age

            let ageSeconds =
                Infinity;


            if (
                bus.recorded_at
            ) {

                const timestamp =
                    new Date(
                        bus.recorded_at
                    ).getTime();


                ageSeconds =
                    (
                        Date.now() -
                        timestamp
                    ) / 1000;

            }


            const isOnline =
                ageSeconds <= 60;


            if (isOnline) {

                activeCount++;

            }


            // Determine route text

            let routeText =
                bus.route ||
                "Route not assigned";


            if (
                bus.route_id
            ) {


                const route =
                    allRoutes.find(
                        item =>
                            String(
                                item.id
                            ) ===
                            String(
                                bus.route_id
                            )
                    );


                if (route) {

                    routeText =
                        `${route.route_name} — ${route.direction}`;

                }

            }


            // Popup

            const popup =
                `

                <div class="popup">

                    <div class="popup-title">

                        🚌 ${escapeHtml(
                            bus.bus_id
                        )}

                    </div>


                    <strong>
                        Route:
                    </strong>

                    ${escapeHtml(
                        routeText
                    )}

                    <br>


                    <strong>
                        Speed:
                    </strong>

                    ${(
                        Number(
                            bus.speed
                        ) || 0
                    ).toFixed(1)}
                    km/h

                    <br>


                    <strong>
                        Heading:
                    </strong>

                    ${(
                        Number(
                            bus.heading
                        ) || 0
                    ).toFixed(0)}°

                    <br>


                    <strong>
                        GPS:
                    </strong>

                    ${
                        bus.recorded_at
                            ? new Date(
                                bus.recorded_at
                            ).toLocaleTimeString()
                            : "Unknown"
                    }

                    <br>


                    <strong>
                        Status:
                    </strong>

                    ${
                        isOnline
                            ? "🟢 Online"
                            : "🔴 Offline"
                    }

                </div>

                `;


            // =================================================
            // UPDATE EXISTING MARKER
            // =================================================

            if (
                busMarkers[
                    bus.bus_id
                ]
            ) {


                busMarkers[
                    bus.bus_id
                ]

                .setLatLng([
                    lat,
                    lng
                ])

                .setPopupContent(
                    popup
                );


            }


            // =================================================
            // CREATE NEW MARKER
            // =================================================

            else {


                busMarkers[
                    bus.bus_id
                ] =

                    L.marker(

                        [
                            lat,
                            lng
                        ],

                        {
                            icon:
                                busIcon
                        }

                    )

                    .addTo(map)

                    .bindPopup(
                        popup
                    );

            }


            // =================================================
            // CREATE BUS CARD
            // =================================================

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "bus-card";


            card.innerHTML = `

                <div class="bus-header">

                    <div class="bus-name">

                        <span class="
                            status-dot
                            ${
                                isOnline
                                    ? "dot-online"
                                    : "dot-offline"
                            }
                        "></span>

                        ${escapeHtml(
                            bus.bus_id
                        )}

                    </div>


                    <div class="
                        ${
                            isOnline
                                ? "status-online"
                                : "status-offline"
                        }
                    ">

                        ${
                            isOnline
                                ? "ONLINE"
                                : "OFFLINE"
                        }

                    </div>

                </div>


                <div class="bus-route">

                    ${escapeHtml(
                        routeText
                    )}

                </div>


                <div class="bus-details">

                    Speed:
                    ${
                        (
                            Number(
                                bus.speed
                            ) || 0
                        ).toFixed(1)
                    }
                    km/h

                    <br>

                    Last GPS:
                    ${
                        bus.recorded_at
                            ? new Date(
                                bus.recorded_at
                            ).toLocaleTimeString()
                            : "Unknown"
                    }

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    map.setView(

                        [
                            lat,
                            lng
                        ],

                        15

                    );


                    busMarkers[
                        bus.bus_id
                    ].openPopup();

                }
            );


            busList.appendChild(
                card
            );

        }
    );


    document.getElementById(
        "activeBuses"
    ).innerText =
        activeCount;


    if (
        buses.length === 0
    ) {

        busList.innerHTML = `

            <div style="
                color:#6b7280;
                font-size:13px;
                padding:8px 0;
            ">

                No buses are transmitting GPS.

            </div>

        `;

    }


    // =========================================================
    // REMOVE MARKERS FOR BUSES NO LONGER IN DATABASE
    // =========================================================

    Object.keys(
        busMarkers
    ).forEach(
        busId => {

            if (
                !currentlyVisibleBuses[
                    busId
                ]
            ) {

                map.removeLayer(
                    busMarkers[
                        busId
                    ]
                );

                delete busMarkers[
                    busId
                ];

            }

        }
    );

}



/* ==========================================================
   INITIALIZE
========================================================== */


async function initialize() {

    await loadRoutes();

    await loadBusLocations();

}


initialize();



/* ==========================================================
   REFRESH BUS POSITIONS
========================================================== */


setInterval(

    loadBusLocations,

    5000

);



/* ==========================================================
   REFRESH ROUTES
========================================================== */


setInterval(

    async () => {

        await loadRoutes();

    },

    5 * 60 * 1000

);

</script>

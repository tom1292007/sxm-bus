<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SXM Bus — Admin</title>


<!-- =====================================================
     LEAFLET
====================================================== -->

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
>


<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f4f6;
}


body {

    overflow: hidden;
}


/* ========================================================
   HEADER
======================================================== */

.header {

    height: 70px;

    background: #111827;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    position: relative;

    z-index: 2000;
}


.header-title {

    font-size: 22px;

    font-weight: bold;
}


.header-subtitle {

    font-size: 12px;

    color: #cbd5e1;

    margin-top: 4px;
}


.connection {

    padding: 8px 14px;

    border-radius: 20px;

    background: #374151;

    font-size: 12px;

    font-weight: bold;
}


.connection-ok {

    color: #86efac;
}


.connection-error {

    color: #fca5a5;
}



/* ========================================================
   MAIN
======================================================== */

.main {

    height: calc(100vh - 70px);

    display: flex;
}



/* ========================================================
   SIDEBAR
======================================================== */

.sidebar {

    width: 370px;

    min-width: 320px;

    background: white;

    border-right:
        1px solid #e5e7eb;

    overflow-y: auto;

    padding: 15px;

    z-index: 1500;
}


.section-title {

    font-size: 15px;

    font-weight: bold;

    margin-bottom: 10px;

    color: #111827;
}



/* ========================================================
   SUMMARY
======================================================== */

.summary {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 20px;
}


.summary-card {

    background: #f9fafb;

    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    text-align: center;

    padding: 12px 6px;
}


.summary-number {

    font-size: 22px;

    font-weight: bold;
}


.summary-label {

    font-size: 10px;

    color: #6b7280;

    margin-top: 3px;
}



/* ========================================================
   BUS CARD
======================================================== */

.bus-card {

    border:
        1px solid #e5e7eb;

    border-radius: 11px;

    padding: 13px;

    margin-bottom: 10px;

    cursor: pointer;

    background: white;
}


.bus-card:hover {

    background: #f9fafb;
}


.bus-header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom: 7px;
}


.bus-name {

    font-weight: bold;

    font-size: 17px;
}


.online {

    color: #16a34a;

    font-size: 11px;

    font-weight: bold;
}


.offline {

    color: #dc2626;

    font-size: 11px;

    font-weight: bold;
}


.dot {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    display: inline-block;

    margin-right: 5px;
}


.dot-green {

    background: #22c55e;
}


.dot-red {

    background: #ef4444;
}


.bus-route {

    font-size: 13px;

    color: #374151;

    line-height: 1.4;
}


.bus-position {

    margin-top: 10px;

    padding: 9px;

    background: #f8fafc;

    border-radius: 8px;

    font-size: 12px;

    line-height: 1.7;
}


.progress-bar {

    width: 100%;

    height: 7px;

    border-radius: 10px;

    background: #e5e7eb;

    overflow: hidden;

    margin-top: 7px;
}


.progress-fill {

    height: 100%;

    width: 0%;

    background: #2563eb;
}



/* ========================================================
   ROUTES
======================================================== */

.route-section {

    margin-top: 25px;
}


.region-title {

    font-size: 12px;

    font-weight: bold;

    margin:
        14px 0 7px 2px;

    color: #111827;
}


.line-title {

    font-size: 12px;

    font-weight: bold;

    margin:
        10px 0 5px 5px;

    color: #374151;
}


.route-card {

    border:
        1px solid #e5e7eb;

    border-radius: 8px;

    padding: 9px;

    margin-bottom: 6px;

    cursor: pointer;
}


.route-card:hover {

    background: #f9fafb;
}


.route-direction {

    font-size: 12px;

    font-weight: bold;
}


.route-meta {

    font-size: 10px;

    color: #6b7280;

    margin-top: 4px;
}


/* ========================================================
   MAP
======================================================== */

#map {

    flex: 1;

    height: 100%;
}



/* ========================================================
   POPUPS
======================================================== */

.popup {

    font-size: 13px;

    line-height: 1.55;
}


.popup-title {

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 4px;
}



/* ========================================================
   MOBILE
======================================================== */

@media (
    max-width: 700px
) {

    .sidebar {

        width: 285px;

        min-width: 285px;
    }


    .header-title {

        font-size: 17px;
    }


    .header-subtitle {

        display: none;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<div class="header">


    <div>

        <div class="header-title">

            🚌 SXM BUS — ADMIN

        </div>

        <div class="header-subtitle">

            Live St. Maarten / St. Martin Fleet Monitoring

        </div>

    </div>


    <div
        id="connectionStatus"
        class="connection"
    >

        Connecting...

    </div>


</div>



<!-- =======================================================
     MAIN
======================================================== -->

<div class="main">


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <div class="sidebar">


        <!-- SUMMARY -->

        <div class="section-title">

            Fleet Overview

        </div>


        <div class="summary">


            <div class="summary-card">

                <div
                    id="totalBuses"
                    class="summary-number"
                >
                    0
                </div>

                <div class="summary-label">
                    Buses
                </div>

            </div>


            <div class="summary-card">

                <div
                    id="activeBuses"
                    class="summary-number"
                >
                    0
                </div>

                <div class="summary-label">
                    Active
                </div>

            </div>


            <div class="summary-card">

                <div
                    id="totalRoutes"
                    class="summary-number"
                >
                    0
                </div>

                <div class="summary-label">
                    Routes
                </div>

            </div>


        </div>



        <!-- LIVE BUSES -->

        <div class="section-title">

            Live Buses

        </div>


        <div id="busList">

            Loading...

        </div>



        <!-- ROUTES -->

        <div class="route-section">


            <div class="section-title">

                Active Routes

            </div>


            <div id="routeList">

                Loading routes...

            </div>


        </div>


    </div>



    <!-- ===================================================
         MAP
    ==================================================== -->

    <div id="map"></div>


</div>



<!-- =======================================================
     LEAFLET
======================================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
></script>



<script>


// ==========================================================
// SUPABASE
// ==========================================================


const SUPABASE_URL =
    "https://enqyrmpdaxuelqlgevnl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_J_P6bfidx389dnZJc3H43A_vK3ccYnW";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// ==========================================================
// MAP
// ==========================================================


const map =
    L.map("map")
        .setView(
            [
                18.0425,
                -63.0548
            ],
            12
        );


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            "&copy; OpenStreetMap contributors"
    }
).addTo(map);



// ==========================================================
// DATA
// ==========================================================


let routes = [];

let routeLayers = {};

let routeStatus = {};

let busMarkers = {};

let busesById = {};



// ==========================================================
// BUS ICON
// ==========================================================


const busIcon =
    L.divIcon({

        className: "",

        html: `

            <div style="
                width:42px;
                height:42px;
                border-radius:50%;
                background:white;
                border:2px solid #111827;
                display:flex;
                justify-content:center;
                align-items:center;
                font-size:25px;
                box-shadow:0 2px 8px rgba(0,0,0,.25);
            ">
                🚌
            </div>

        `,

        iconSize: [
            42,
            42
        ],

        iconAnchor: [
            21,
            21
        ]

    });



// ==========================================================
// LOAD ROUTES
// ==========================================================


async function loadRoutes() {


    const {
        data,
        error
    } =
        await supabaseClient

            .from("routes")

            .select(
                `
                id,
                route_name,
                direction,
                active,
                region,
                line_number,
                line_code,
                variant,
                origin,
                destination,
                road_geometry,
                road_distance_meters,
                road_duration_seconds
                `
            )

            .eq(
                "active",
                true
            )

            .order(
                "region",
                {
                    ascending: true
                }
            )

            .order(
                "line_number",
                {
                    ascending: true
                }
            )

            .order(
                "variant",
                {
                    ascending: true,
                    nullsFirst: true
                }
            )

            .order(
                "direction",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Route error:",
            error
        );

        document.getElementById(
            "routeList"
        ).innerHTML = `

            <div style="color:#dc2626;font-size:12px">

                ❌ ${escapeHtml(
                    error.message
                )}

            </div>

        `;

        return;

    }


    routes =
        data || [];


    document.getElementById(
        "totalRoutes"
    ).innerText =
        routes.length;


    drawAllRoutes();

    renderRouteList();

}



// ==========================================================
// DRAW ALL ROUTES
// ==========================================================


function drawAllRoutes() {


    // Remove old route layers

    Object.values(
        routeLayers
    ).forEach(
        layer => {

            map.removeLayer(
                layer
            );

        }
    );


    routeLayers = {};


    routeStatus = {};


    routes.forEach(
        (route, index) => {


            if (
                !route.road_geometry
            ) {

                routeStatus[
                    route.id
                ] = "missing";

                return;

            }


            const geometry =
                route.road_geometry;


            if (
                geometry.type !==
                "LineString"
            ) {

                routeStatus[
                    route.id
                ] = "invalid";

                return;

            }


            const coordinates =
                geometry.coordinates
                    .map(
                        point => [
                            Number(
                                point[1]
                            ),
                            Number(
                                point[0]
                            )
                        ]
                    );


            if (
                coordinates.length < 2
            ) {

                routeStatus[
                    route.id
                ] = "missing";

                return;

            }


            const line =
                L.polyline(

                    coordinates,

                    {

                        weight: 4,

                        opacity: 0.65

                    }

                );


            line
                .bindPopup(
                    `
                    <div class="popup">

                        <div class="popup-title">

                            ${escapeHtml(
                                route.route_name
                            )}

                        </div>

                        ${escapeHtml(
                            route.direction
                        )}

                    </div>
                    `
                );


            line.addTo(map);


            routeLayers[
                route.id
            ] = line;


            routeStatus[
                route.id
            ] = "ready";

        }
    );

}



// ==========================================================
// ROUTE LIST
// ==========================================================


function renderRouteList() {


    const container =
        document.getElementById(
            "routeList"
        );


    container.innerHTML = "";


    const groups = {};


    routes.forEach(
        route => {


            const region =
                route.region ||
                "Other";


            const line =
                route.line_code ||
                route.line_number ||
                "OTHER";


            const key =
                `${region}-${line}`;


            if (
                !groups[key]
            ) {

                groups[key] = {

                    region:
                        region,

                    line:
                        line,

                    lineNumber:
                        route.line_number ||
                        999,

                    routes:
                        []

                };

            }


            groups[key]
                .routes
                .push(route);

        }
    );


    const sortedGroups =
        Object.values(groups)
            .sort(
                (a, b) => {

                    if (
                        a.region !==
                        b.region
                    ) {

                        return a.region ===
                            "Dutch Side"
                            ? -1
                            : 1;

                    }


                    return (
                        a.lineNumber -
                        b.lineNumber
                    );

                }
            );


    let previousRegion =
        null;


    sortedGroups.forEach(
        group => {


            if (
                group.region !==
                previousRegion
            ) {


                const regionTitle =
                    document.createElement(
                        "div"
                    );


                regionTitle.className =
                    "region-title";


                regionTitle.innerText =

                    group.region ===
                    "Dutch Side"

                        ? "🇸🇽 DUTCH SIDE"

                        : "🇫🇷 FRENCH SIDE";


                container.appendChild(
                    regionTitle
                );


                previousRegion =
                    group.region;

            }


            const lineTitle =
                document.createElement(
                    "div"
                );


            lineTitle.className =
                "line-title";


            if (
                group.region ===
                "Dutch Side"
            ) {

                lineTitle.innerText =
                    `LINE ${group.lineNumber}`;

            }

            else {

                lineTitle.innerText =
                    group.routes[0]
                        .route_name
                        .replace(
                            "French Side - ",
                            ""
                        );

            }


            container.appendChild(
                lineTitle
            );


            group.routes
                .sort(
                    compareRoutes
                )
                .forEach(
                    route => {


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "route-card";


                        const distance =
                            Number(
                                route.road_distance_meters
                            ) || 0;


                        const geometryReady =
                            routeStatus[
                                route.id
                            ] === "ready";


                        card.innerHTML = `

                            <div class="
                                route-direction
                            ">

                                ${escapeHtml(
                                    route.variant
                                        ? `${route.variant} — ${route.direction}`
                                        : route.direction
                                )}

                            </div>


                            <div class="
                                route-meta
                            ">

                                ${
                                    geometryReady
                                        ? "✓ Road geometry"
                                        : "⚠ Geometry missing"
                                }

                                ${
                                    distance
                                        ? " • " +
                                          (
                                              distance /
                                              1000
                                          ).toFixed(
                                              1
                                          ) +
                                          " km"
                                        : ""
                                }

                            </div>

                        `;


                        card.addEventListener(
                            "click",
                            () => {

                                focusRoute(
                                    route
                                );

                            }
                        );


                        container.appendChild(
                            card
                        );

                    }
                );

        }
    );

}



// ==========================================================
// ROUTE SORT
// ==========================================================


function compareRoutes(
    a,
    b
) {


    const av =
        a.variant || "";


    const bv =
        b.variant || "";


    if (
        av !== bv
    ) {

        return av.localeCompare(
            bv
        );

    }


    return (
        a.direction || ""
    )
    .localeCompare(
        b.direction || ""
    );

}



// ==========================================================
// FOCUS ROUTE
// ==========================================================


function focusRoute(
    route
) {


    const layer =
        routeLayers[
            route.id
        ];


    if (
        layer
    ) {


        map.fitBounds(
            layer.getBounds(),
            {
                padding: [
                    30,
                    30
                ]
            }
        );


        layer.openPopup();


        return;

    }


    if (
        route.road_geometry &&
        Array.isArray(
            route.road_geometry.coordinates
        )
    ) {


        const points =
            route.road_geometry
                .coordinates
                .map(
                    point => [
                        point[1],
                        point[0]
                    ]
                );


        map.fitBounds(
            L.latLngBounds(
                points
            ),
            {
                padding: [
                    30,
                    30
                ]
            }
        );

    }

}



// ==========================================================
// LOAD BUSES
// ==========================================================


async function loadBusLocations() {


    const {
        data,
        error
    } =
        await supabaseClient

            .from("bus_locations")

            .select("*");


    const connection =
        document.getElementById(
            "connectionStatus"
        );


    if (
        error
    ) {


        console.error(
            "Bus error:",
            error
        );


        connection.innerText =
            "🔴 Database Error";


        connection.className =
            "connection connection-error";


        return;

    }


    connection.innerText =
        "🟢 Connected";


    connection.className =
        "connection connection-ok";


    const buses =
        data || [];


    busesById = {};


    buses.forEach(
        bus => {

            busesById[
                bus.bus_id
            ] = bus;

        }
    );


    document.getElementById(
        "totalBuses"
    ).innerText =
        buses.length;


    let activeCount =
        0;


    const currentlyPresent = {};


    const busList =
        document.getElementById(
            "busList"
        );


    busList.innerHTML =
        "";


    buses.forEach(
        bus => {


            const lat =
                Number(
                    bus.latitude
                );


            const lng =
                Number(
                    bus.longitude
                );


            if (
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ) {

                return;

            }


            currentlyPresent[
                bus.bus_id
            ] = true;


            // =================================================
            // ONLINE CHECK
            // =================================================


            let ageSeconds =
                Infinity;


            if (
                bus.last_seen
            ) {

                ageSeconds =

                    (
                        Date.now() -
                        new Date(
                            bus.last_seen
                        ).getTime()
                    ) / 1000;

            }


            const isOnline =
                bus.is_active === true &&
                ageSeconds <= 60;


            if (
                isOnline
            ) {

                activeCount++;

            }


            // =================================================
            // ROUTE
            // =================================================


            let route =
                null;


            if (
                bus.route_id
            ) {

                route =
                    routes.find(
                        item =>
                            String(
                                item.id
                            ) ===
                            String(
                                bus.route_id
                            )
                    );

            }


            const routeName =
                route

                    ? (
                        route.variant
                            ? `Line ${route.line_number} — ${route.variant}`
                            : route.route_name
                    )

                    : (
                        bus.route ||
                        "Route not assigned"
                    );


            const direction =
                route

                    ? route.direction

                    : "";



            // =================================================
            // ROUTE PROGRESS
            // =================================================


            const progress =
                Number(
                    bus.route_progress_fraction
                ) || 0;


            const progressPercent =
                Math.max(
                    0,
                    Math.min(
                        100,
                        progress * 100
                    )
                );


            const progressDistance =
                Number(
                    bus.route_progress_meters
                );


            const remainingDistance =
                Number(
                    bus.route_remaining_meters
                );


            const offRoute =
                Number(
                    bus.distance_to_route_meters
                );


            // =================================================
            // POPUP
            // =================================================


            const popup =
                `

                <div class="popup">

                    <div class="popup-title">

                        🚌 ${escapeHtml(
                            bus.bus_id
                        )}

                    </div>


                    <strong>
                        Route:
                    </strong>

                    ${escapeHtml(
                        routeName
                    )}

                    <br>

                    ${
                        direction
                            ? escapeHtml(
                                direction
                            ) +
                              "<br>"
                            : ""
                    }


                    <strong>
                        Speed:
                    </strong>

                    ${
                        Number(
                            bus.speed
                        ).toFixed(1)
                    }
                    km/h

                    <br>


                    <strong>
                        Progress:
                    </strong>

                    ${
                        progressPercent.toFixed(
                            1
                        )
                    }%

                    <br>


                    <strong>
                        Remaining:
                    </strong>

                    ${
                        Number.isFinite(
                            remainingDistance
                        )
                            ? formatDistance(
                                remainingDistance
                              )
                            : "—"
                    }

                    <br>


                    <strong>
                        Off route:
                    </strong>

                    ${
                        Number.isFinite(
                            offRoute
                        )
                            ? formatDistance(
                                offRoute
                              )
                            : "—"
                    }

                    <br>


                    <strong>
                        GPS:
                    </strong>

                    ${
                        bus.last_seen
                            ? new Date(
                                bus.last_seen
                              ).toLocaleTimeString()
                            : "—"
                    }

                </div>

                `;


            // =================================================
            // MARKER
            // =================================================


            if (
                busMarkers[
                    bus.bus_id
                ]
            ) {


                busMarkers[
                    bus.bus_id
                ]

                .setLatLng([
                    lat,
                    lng
                ])

                .setPopupContent(
                    popup
                );


            }

            else {


                busMarkers[
                    bus.bus_id
                ] =

                    L.marker(

                        [
                            lat,
                            lng
                        ],

                        {
                            icon:
                                busIcon
                        }

                    )

                    .addTo(map)

                    .bindPopup(
                        popup
                    );

            }


            // =================================================
            // BUS CARD
            // =================================================


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "bus-card";


            card.innerHTML = `

                <div class="bus-header">

                    <div class="bus-name">

                        <span class="
                            dot
                            ${
                                isOnline
                                    ? "dot-green"
                                    : "dot-red"
                            }
                        "></span>

                        ${escapeHtml(
                            bus.bus_id
                        )}

                    </div>


                    <div class="
                        ${
                            isOnline
                                ? "online"
                                : "offline"
                        }
                    ">

                        ${
                            isOnline
                                ? "ONLINE"
                                : "OFFLINE"
                        }

                    </div>

                </div>


                <div class="bus-route">

                    <strong>
                        ${escapeHtml(
                            routeName
                        )}
                    </strong>

                    ${
                        direction
                            ? `<br>${escapeHtml(
                                direction
                              )}`
                            : ""
                    }

                </div>


                <div class="bus-position">

                    <strong>
                        Route Position
                    </strong>

                    <br>


                    Along route:
                    ${
                        Number.isFinite(
                            progressDistance
                        )
                            ? formatDistance(
                                progressDistance
                              )
                            : "—"
                    }


                    <br>


                    Remaining:
                    ${
                        Number.isFinite(
                            remainingDistance
                        )
                            ? formatDistance(
                                remainingDistance
                              )
                            : "—"
                    }


                    <br>


                    Progress:
                    ${
                        progressPercent.toFixed(
                            1
                        )
                    }%


                    <div class="progress-bar">

                        <div
                            class="progress-fill"
                            style="
                                width:${
                                    progressPercent
                                }%;
                            "
                        ></div>

                    </div>


                    <br>


                    ${
                        Number.isFinite(
                            offRoute
                        )
                            ? `Off route:
                               ${formatDistance(
                                   offRoute
                               )}<br>`
                            : ""
                    }


                    ${
                        Number.isFinite(
                            Number(
                                bus.speed
                            )
                        )
                            ? `Speed:
                               ${Number(
                                   bus.speed
                               ).toFixed(1)}
                               km/h<br>`
                            : ""
                    }


                    ${
                        bus.accuracy_meters !== null &&
                        bus.accuracy_meters !== undefined
                            ? `GPS accuracy:
                               ${Math.round(
                                   Number(
                                       bus.accuracy_meters
                                   )
                               )} m<br>`
                            : ""
                    }


                    Last update:
                    ${
                        bus.last_seen
                            ? new Date(
                                bus.last_seen
                              ).toLocaleTimeString()
                            : "—"
                    }

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    map.setView(

                        [
                            lat,
                            lng
                        ],

                        15

                    );


                    busMarkers[
                        bus.bus_id
                    ].openPopup();

                }
            );


            busList.appendChild(
                card
            );

        }
    );


    document.getElementById(
        "activeBuses"
    ).innerText =
        activeCount;


    if (
        buses.length === 0
    ) {

        busList.innerHTML = `

            <div style="
                color:#6b7280;
                font-size:12px;
                padding:8px;
            ">

                No buses transmitting.

            </div>

        `;

    }


    // =========================================================
    // REMOVE OLD MARKERS
    // =========================================================


    Object.keys(
        busMarkers
    ).forEach(
        busId => {

            if (
                !currentlyPresent[
                    busId
                ]
            ) {

                map.removeLayer(
                    busMarkers[
                        busId
                    ]
                );

                delete busMarkers[
                    busId
                ];

            }

        }
    );

}



// ==========================================================
// FORMAT DISTANCE
// ==========================================================


function formatDistance(
    meters
) {


    if (
        !Number.isFinite(
            meters
        )
    ) {

        return "—";

    }


    if (
        meters < 1000
    ) {

        return Math.round(
            meters
        ) + " m";

    }


    return (
        meters / 1000
    )
    .toFixed(2) +
    " km";

}



// ==========================================================
// HTML ESCAPE
// ==========================================================


function escapeHtml(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================================
// INITIALIZE
// ==========================================================


async function initialize() {

    await loadRoutes();

    await loadBusLocations();

}


initialize();



// ==========================================================
// REFRESH LIVE BUS DATA
// ==========================================================


setInterval(

    loadBusLocations,

    5000

);



// ==========================================================
// REFRESH ROUTES
// ==========================================================


setInterval(

    loadRoutes,

    5 * 60 * 1000

);

</script>


</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SXM Bus — Admin Control</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{--bg:#0b1220;--panel:#111827;--panel2:#172033;--text:#eef4ff;--muted:#9fb0c7;--border:#263349;--good:#2dd4bf;--warn:#fbbf24;--bad:#fb7185;}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
    header{padding:14px 18px;background:#0e1729;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center;position:sticky;top:0;z-index:1000}
    h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.pill{padding:7px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted);background:#0b1322}
    .layout{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 68px)}
    aside{overflow:auto;border-right:1px solid var(--border);background:var(--panel);padding:14px}.section{margin-bottom:16px}.section h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:#b9c7da;margin:0 0 10px}
    #map{width:100%;height:100%}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
    .legend{display:grid;grid-template-columns:1fr 1fr;gap:7px}.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#dce6f4}.swatch{width:22px;height:5px;border-radius:999px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
    .bus-card{border:1px solid var(--border);background:#0e1729;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}.bus-card:hover{background:#152137}.bus-top{display:flex;justify-content:space-between;gap:8px}.bus-id{font-weight:700}.badge{font-size:10px;padding:3px 6px;border-radius:999px;background:#172237;color:#cbd5e1}.online{color:#5eead4}.offline{color:#fb7185}.warn{color:#fbbf24}
    .line{font-size:12px;margin-top:6px;color:#d7e2f0}.meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}.progress{height:7px;background:#243044;border-radius:999px;overflow:hidden;margin-top:7px}.progress>div{height:100%;border-radius:999px}.empty{font-size:12px;color:var(--muted);padding:10px 0}
    .leaflet-popup-content{margin:10px 12px}.popup-title{font-weight:700;font-size:14px}.popup-meta{font-size:12px;line-height:1.5;margin-top:5px}.route-label{font-weight:700}
    @media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}.layout aside{height:auto;max-height:none}.map-wrap{height:60vh;min-height:420px}}
  </style>
</head>
<body>
<header><div><h1>SXM Bus Control</h1><div class="sub">Live fleet, routes and trip progress</div></div><div class="pill" id="updated">Loading…</div></header>
<div class="layout">
  <aside>
    <div class="section"><h2>Fleet</h2><div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>Active buses</span></div>
      <div class="stat"><b id="statOnline">0</b><span>Online now</span></div>
      <div class="stat"><b id="statOffRoute">0</b><span>Off route</span></div>
      <div class="stat"><b id="statTrips">0</b><span>Live trips</span></div>
    </div></div>

    <div class="section"><h2>Route colors</h2><div class="legend" id="legend"></div></div>
    <div class="section"><h2>Live buses</h2><div id="busList"><div class="empty">Waiting for data…</div></div></div>
  </aside>
  <div class="map-wrap"><div id="map"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://enqyrmpdaxuelqlgevnl.supabase.co';
const SUPABASE_KEY='sb_publishable_J_P6bfidx389dnZJc3H43A_vK3ccYnW';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const LINE_COLORS={L1:'#2563eb',L2:'#16a34a',L3:'#dc2626',L4:'#ea580c',L5:'#7c3aed',F1:'#0891b2',F2:'#db2777',F3:'#92400e',F4:'#475569'};
const FALLBACK_COLORS=['#2563eb','#16a34a','#dc2626','#ea580c','#7c3aed','#0891b2','#db2777','#92400e','#475569','#0f766e'];
const LINE_OFFSETS={L1:-16,L2:-8,L3:0,L4:8,L5:16,F1:-16,F2:-8,F3:8,F4:16};
const DEFAULT_CENTER=[18.04,-63.06];
let map, routes=[], buses=[], routeLayers=new Map(), busMarkers=new Map();

function colorForRoute(r){return LINE_COLORS[r.line_code] || FALLBACK_COLORS[(Number(r.line_number||0)-1)%FALLBACK_COLORS.length] || '#334155'}
function offsetForRoute(r){return LINE_OFFSETS[r.line_code] ?? 0}
function geometryCoords(r){
  const g=r?.road_geometry;
  if(!g) return [];
  if(g.type==='Feature') return g.geometry?.coordinates || [];
  if(g.type==='LineString') return g.coordinates || [];
  return [];
}
function toLatLngs(r){return geometryCoords(r).map(c=>[c[1],c[0]]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]))}

// Visual-only parallel offset. The stored route geometry remains unchanged.
function offsetLatLngs(points, meters){
  if(!meters || points.length<2) return points;
  const lat0=points.reduce((a,p)=>a+p[0],0)/points.length*Math.PI/180;
  const mLat=111320, mLng=111320*Math.cos(lat0);
  const xy=points.map(p=>({x:p[1]*mLng,y:p[0]*mLat}));
  const out=[];
  for(let i=0;i<xy.length;i++){
    const a=xy[Math.max(0,i-1)], b=xy[Math.min(xy.length-1,i+1)];
    let dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    out.push([(xy[i].y+ny*meters)/mLat,(xy[i].x+nx*meters)/mLng]);
  }
  return out;
}
function displayName(r){return r.variant ? `${r.route_name} · ${r.variant}` : r.route_name || 'Route'}
function routeLabel(r){return `${r.line_code || ('L'+(r.line_number||''))} · ${r.direction || ''}`}

function initMap(){
  map=L.map('map',{preferCanvas:true}).setView(DEFAULT_CENTER,12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
}
function buildLegend(){
  const seen=new Set(); const el=document.getElementById('legend'); el.innerHTML='';
  routes.forEach(r=>{
    const code=r.line_code || `L${r.line_number||''}`; if(seen.has(code)) return; seen.add(code);
    const item=document.createElement('div'); item.className='legend-item';
    item.innerHTML=`<span class="swatch" style="background:${colorForRoute(r)}"></span><span>${code}${r.line_number?` — Line ${r.line_number}`:''}</span>`;
    el.appendChild(item);
  });
}
function drawRoutes(){
  routeLayers.forEach(l=>map.removeLayer(l)); routeLayers.clear();
  routes.forEach(r=>{
    const pts=toLatLngs(r); if(pts.length<2) return;
    const displayPts=offsetLatLngs(pts,offsetForRoute(r));
    const color=colorForRoute(r);
    const halo=L.polyline(displayPts,{color:'#ffffff',weight:10,opacity:.85,interactive:false});
    const line=L.polyline(displayPts,{color,weight:5,opacity:.88,lineCap:'round',lineJoin:'round'});
    const group=L.layerGroup([halo,line]).addTo(map);
    const label=displayName(r);
    line.bindTooltip(label,{sticky:true,opacity:.9});
    line.bindPopup(`<div class="popup-title" style="color:${color}">${label}</div><div class="popup-meta">${routeLabel(r)}<br>${r.origin||''} → ${r.destination||''}<br>Road distance: ${formatKm(r.road_distance_meters)}</div>`);
    routeLayers.set(r.id,group);
  });
}
function formatKm(m){return Number.isFinite(Number(m)) ? `${(Number(m)/1000).toFixed(1)} km` : '—'}
function formatTime(ts){if(!ts)return '—';const d=new Date(ts);return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function ageSeconds(ts){return ts ? (Date.now()-new Date(ts).getTime())/1000 : Infinity}
function busIsOnline(b){return b.is_active===true && ageSeconds(b.last_seen || b.recorded_at)<60}
function routeForBus(b){return routes.find(r=>Number(r.id)===Number(b.route_id)) || routes.find(r=>r.line_code===b.line_code && r.variant===b.variant && r.direction===b.direction) || null}

function busIcon(b,r){
  const color=r?colorForRoute(r):'#475569';
  const label=(b.bus_id||'?').replace(/^BUS_/i,'');
  return L.divIcon({className:'',iconSize:[46,34],iconAnchor:[23,17],html:`<div style="width:46px;height:30px;border-radius:9px;border:3px solid white;background:${color};box-shadow:0 2px 9px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:11px;">🚌 ${label}</div>`});
}
function popupHtml(b,r){
 const color=r?colorForRoute(r):'#475569';
 const online=busIsOnline(b);
 const prog=Number.isFinite(Number(b.route_progress_fraction))?Math.max(0,Math.min(1,Number(b.route_progress_fraction)))*100:null;
 return `<div class="popup-title" style="color:${color}">${b.bus_id||'Bus'}</div>
 <div class="popup-meta"><b>${r?displayName(r):b.route_name||'No route'}</b><br>
 ${r?.direction||b.direction||''}<br>
 Status: <b>${online?'ONLINE':'OFFLINE'}</b><br>
 Speed: ${Number.isFinite(Number(b.speed))?(Number(b.speed)*3.6).toFixed(0)+' km/h':'—'}<br>
 Progress: ${prog!==null?prog.toFixed(0)+'%':'—'}<br>
 Remaining: ${formatKm(b.route_remaining_meters)}<br>
 GPS accuracy: ${Number.isFinite(Number(b.accuracy))?Number(b.accuracy).toFixed(0)+' m':'—'}<br>
 Last seen: ${formatTime(b.last_seen||b.recorded_at)}</div>`;
}
function renderBuses(){
  const list=document.getElementById('busList'); list.innerHTML='';
  let off=0,trips=0,online=0;
  buses.sort((a,b)=>String(a.bus_id).localeCompare(String(b.bus_id)));
  buses.forEach(b=>{
    const r=routeForBus(b); const isOnline=busIsOnline(b); if(isOnline)online++;
    const isOff=Number(b.distance_to_route_meters)>150; if(isOff)off++;
    if(b.is_active)trips++;
    const card=document.createElement('div');card.className='bus-card';
    const color=r?colorForRoute(r):'#475569';
    const prog=Number.isFinite(Number(b.route_progress_fraction))?Math.max(0,Math.min(1,Number(b.route_progress_fraction)))*100:null;
    card.innerHTML=`<div class="bus-top"><div class="bus-id" style="color:${color}">${b.bus_id||'—'}</div><div class="badge ${isOnline?'online':'offline'}">${isOnline?'ONLINE':'OFFLINE'}</div></div>
      <div class="line">${r?displayName(r):'No assigned route'}</div>
      <div class="meta">${r?.direction||b.direction||'—'}<br>Speed: ${Number.isFinite(Number(b.speed))?(Number(b.speed)*3.6).toFixed(0)+' km/h':'—'} · Remaining: ${formatKm(b.route_remaining_meters)}<br>${isOff?'<span class="warn">⚠ Off route</span>':'Accuracy: '+(Number.isFinite(Number(b.accuracy))?Number(b.accuracy).toFixed(0)+' m':'—')}</div>
      ${prog!==null?`<div class="progress"><div style="width:${prog}%;background:${color}"></div></div>`:''}`;
    card.onclick=()=>{if(Number.isFinite(Number(b.latitude))&&Number.isFinite(Number(b.longitude))){map.setView([b.latitude,b.longitude],15,{animate:true});busMarkers.get(b.bus_id)?.openPopup();}};
    list.appendChild(card);
  });
  if(!buses.length)list.innerHTML='<div class="empty">No buses found.</div>';
  document.getElementById('statTotal').textContent=buses.filter(b=>b.is_active).length;
  document.getElementById('statOnline').textContent=online;
  document.getElementById('statOffRoute').textContent=off;
  document.getElementById('statTrips').textContent=trips;
}
function drawBuses(){
  const active=new Set();
  buses.forEach(b=>{
    if(!Number.isFinite(Number(b.latitude))||!Number.isFinite(Number(b.longitude)))return;
    const id=b.bus_id; active.add(id); const r=routeForBus(b);
    let m=busMarkers.get(id);
    const icon=busIcon(b,r);
    if(!m){m=L.marker([b.latitude,b.longitude],{icon,zIndexOffset:1000}).addTo(map);busMarkers.set(id,m)}else{m.setLatLng([b.latitude,b.longitude]);m.setIcon(icon)}
    m.bindPopup(popupHtml(b,r));
  });
  [...busMarkers.keys()].forEach(id=>{if(!active.has(id)){map.removeLayer(busMarkers.get(id));busMarkers.delete(id)}});
}
async function loadRoutes(){
  const {data,error}=await db.from('routes').select('*').eq('active',true).order('region').order('line_number').order('variant').order('direction');
  if(error)throw error; routes=data||[]; buildLegend(); drawRoutes();
}
async function loadBuses(){
  const {data,error}=await db.from('bus_locations').select('*').order('bus_id');
  if(error)throw error; buses=data||[]; renderBuses(); drawBuses(); document.getElementById('updated').textContent='Updated '+formatTime(new Date().toISOString());
}
async function start(){
  initMap();
  try{await loadRoutes(); await loadBuses();}catch(e){console.error(e);document.getElementById('updated').textContent='Database error';}
  setInterval(async()=>{try{await loadBuses()}catch(e){console.error(e)}},5000);
}
start();
</script>
</body>
</html>

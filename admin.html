<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SXM Bus — Admin Control</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--bg:#0b1220;--panel:#111827;--panel2:#172033;--text:#eef4ff;--muted:#9fb0c7;--border:#263349;--good:#2dd4bf;--warn:#fbbf24;--bad:#fb7185;}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    body{overflow:hidden}
    header{height:68px;padding:12px 18px;background:#0e1729;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.pill{padding:7px 10px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted);background:#0b1322}
    .layout{display:grid;grid-template-columns:380px minmax(0,1fr);height:calc(100vh - 68px);min-height:0}
    aside{min-height:0;overflow:auto;border-right:1px solid var(--border);background:var(--panel);padding:14px}
    .section{margin-bottom:16px}.section h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:#b9c7da;margin:0 0 10px}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
    .legend{display:grid;grid-template-columns:1fr 1fr;gap:7px}.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#dce6f4}.swatch{width:22px;height:6px;border-radius:999px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
    .bus-card{border:1px solid var(--border);background:#0e1729;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}.bus-card:hover{background:#152137}.bus-top{display:flex;justify-content:space-between;gap:8px}.bus-id{font-weight:700}.badge{font-size:10px;padding:3px 6px;border-radius:999px;background:#172237}.online{color:#5eead4}.offline{color:#fb7185}.warn{color:#fbbf24}
    .line{font-size:12px;margin-top:6px;color:#d7e2f0}.meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}.progress{height:7px;background:#243044;border-radius:999px;overflow:hidden;margin-top:7px}.progress>div{height:100%;border-radius:999px}.empty{font-size:12px;color:var(--muted);padding:10px 0}
    .map-wrap{position:relative;min-width:0;min-height:0}.map{width:100%;height:100%;min-height:0}
    .map-error{position:absolute;top:14px;left:14px;right:14px;z-index:1200;display:none;background:#7f1d1d;color:white;padding:11px 13px;border-radius:10px;box-shadow:0 3px 15px rgba(0,0,0,.25);font-size:12px}
    .leaflet-popup-content{margin:10px 12px}.popup-title{font-weight:700;font-size:14px}.popup-meta{font-size:12px;line-height:1.5;margin-top:5px}
    @media(max-width:900px){body{overflow:auto}.layout{grid-template-columns:1fr;height:auto}.map-wrap{height:62vh;min-height:430px}aside{order:2;border-right:0;border-top:1px solid var(--border);max-height:none}}
  </style>
</head>
<body>
<header><div><h1>SXM Bus Control</h1><div class="sub">Live fleet, routes and trip progress</div></div><div class="pill" id="updated">Starting…</div></header>
<div class="layout">
  <aside>
    <div class="section"><h2>Fleet</h2><div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>Active buses</span></div>
      <div class="stat"><b id="statOnline">0</b><span>Online now</span></div>
      <div class="stat"><b id="statOffRoute">0</b><span>Off route</span></div>
      <div class="stat"><b id="statTrips">0</b><span>Live trips</span></div>
    </div></div>
    <div class="section"><h2>Route colors</h2><div class="legend" id="legend"></div></div>
    <div class="section"><h2>Live buses</h2><div id="busList"><div class="empty">Waiting for data…</div></div></div>
  </aside>
  <div class="map-wrap"><div id="map" class="map"></div><div id="mapError" class="map-error"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  'use strict';
  const SUPABASE_URL='https://enqyrmpdaxuelqlgevnl.supabase.co';
  const SUPABASE_KEY='sb_publishable_J_P6bfidx389dnZJc3H43A_vK3ccYnW';
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

  const LINE_COLORS={L1:'#2563eb',L2:'#16a34a',L3:'#dc2626',L4:'#ea580c',L5:'#7c3aed',F1:'#0891b2',F2:'#db2777',F3:'#92400e',F4:'#475569'};
  const LINE_OFFSETS={L1:-12,L2:-6,L3:0,L4:6,L5:12,F1:-12,F2:-6,F3:6,F4:12};
  const FALLBACK_COLORS=['#2563eb','#16a34a','#dc2626','#ea580c','#7c3aed','#0891b2','#db2777','#92400e','#475569','#0f766e'];
  const DEFAULT_CENTER=[18.04,-63.06];
  let map=null,routes=[],buses=[];
  const routeLayers=new Map(),busMarkers=new Map();

  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const colorForRoute=r=>LINE_COLORS[r?.line_code]||FALLBACK_COLORS[Math.max(0,(Number(r?.line_number)||1)-1)%FALLBACK_COLORS.length]||'#334155';
  const displayName=r=>r?.variant?`${r.route_name||'Route'} · ${r.variant}`:(r?.route_name||'Route');
  const formatKm=m=>Number.isFinite(Number(m))?`${(Number(m)/1000).toFixed(1)} km`:'—';
  const formatTime=ts=>ts?new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
  const ageSeconds=ts=>ts?(Date.now()-new Date(ts).getTime())/1000:Infinity;
  const busIsOnline=b=>b?.is_active===true && ageSeconds(b.last_seen||b.recorded_at)<60;

  function showMapError(msg){const el=$('mapError');el.textContent=msg;el.style.display='block';}
  function clearMapError(){$('mapError').style.display='none';}

  function geometryCoords(r){
    const g=r?.road_geometry;
    if(!g)return [];
    if(g.type==='Feature')return Array.isArray(g.geometry?.coordinates)?g.geometry.coordinates:[];
    if(g.type==='LineString')return Array.isArray(g.coordinates)?g.coordinates:[];
    return [];
  }
  function toLatLngs(r){
    return geometryCoords(r).map(c=>Array.isArray(c)&&c.length>=2?[Number(c[1]),Number(c[0])]:null).filter(p=>p&&Number.isFinite(p[0])&&Number.isFinite(p[1]));
  }

  // Visual-only offset in meters. Database geometry is never changed.
  function offsetLatLngs(points,meters){
    if(!meters||points.length<2)return points;
    const lat0=points.reduce((s,p)=>s+p[0],0)/points.length*Math.PI/180;
    const mLat=111320, mLng=Math.max(1000,111320*Math.cos(lat0));
    const xy=points.map(p=>({x:p[1]*mLng,y:p[0]*mLat}));
    return xy.map((p,i)=>{
      const a=xy[Math.max(0,i-1)],b=xy[Math.min(xy.length-1,i+1)];
      const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
      const nx=-dy/len,ny=dx/len;
      return [(p.y+ny*meters)/mLat,(p.x+nx*meters)/mLng];
    });
  }

  function routeForBus(b){
    const id=Number(b?.route_id);
    if(Number.isFinite(id)){
      const found=routes.find(r=>Number(r.id)===id); if(found)return found;
    }
    return routes.find(r=>r.line_code===b?.line_code && r.variant===b?.variant && r.direction===b?.direction)||null;
  }

  function initMap(){
    if(!window.L)throw new Error('Leaflet failed to load. Check your internet connection or GitHub Pages deployment.');
    map=L.map('map',{preferCanvas:true,zoomControl:true}).setView(DEFAULT_CENTER,12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
    setTimeout(()=>map.invalidateSize(),200);
  }

  function buildLegend(){
    const seen=new Set(),el=$('legend');el.innerHTML='';
    for(const r of routes){
      const code=r.line_code||`L${r.line_number||''}`; if(seen.has(code))continue; seen.add(code);
      const item=document.createElement('div');item.className='legend-item';
      item.innerHTML=`<span class="swatch" style="background:${colorForRoute(r)}"></span><span>${esc(code)}${r.line_number?` — Line ${esc(r.line_number)}`:''}</span>`;
      el.appendChild(item);
    }
  }

  function drawRoutes(){
    for(const layer of routeLayers.values())map.removeLayer(layer);routeLayers.clear();
    const all=[];
    for(const r of routes){
      const pts=toLatLngs(r);if(pts.length<2)continue;
      const color=colorForRoute(r);const displayPts=offsetLatLngs(pts,LINE_OFFSETS[r.line_code]??0);
      const halo=L.polyline(displayPts,{color:'#fff',weight:9,opacity:.92,interactive:false,lineCap:'round',lineJoin:'round'});
      const line=L.polyline(displayPts,{color,weight:5,opacity:.9,lineCap:'round',lineJoin:'round'});
      const group=L.layerGroup([halo,line]).addTo(map);
      const label=displayName(r);
      line.bindTooltip(esc(label),{sticky:true,opacity:.95});
      line.bindPopup(`<div class="popup-title" style="color:${color}">${esc(label)}</div><div class="popup-meta">${esc(r.direction||'')}<br>${esc(r.origin||'')} → ${esc(r.destination||'')}<br>Distance: ${formatKm(r.road_distance_meters)}</div>`);
      routeLayers.set(r.id,group);all.push(...displayPts);
    }
    if(all.length){try{map.fitBounds(L.latLngBounds(all).pad(0.05));}catch(e){}}
  }

  function busIcon(b,r){
    const color=r?colorForRoute(r):'#475569';
    const label=esc((b.bus_id||'?').replace(/^BUS_/i,''));
    return L.divIcon({className:'',iconSize:[48,34],iconAnchor:[24,17],html:`<div style="width:48px;height:30px;border-radius:9px;border:3px solid white;background:${color};box-shadow:0 2px 9px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:11px;">🚌 ${label}</div>`});
  }

  function popupHtml(b,r){
    const color=r?colorForRoute(r):'#475569',online=busIsOnline(b);
    const p=Number(b.route_progress_fraction);const prog=Number.isFinite(p)?Math.max(0,Math.min(1,p))*100:null;
    return `<div class="popup-title" style="color:${color}">${esc(b.bus_id||'Bus')}</div><div class="popup-meta"><b>${esc(r?displayName(r):(b.route_name||'No route'))}</b><br>${esc(r?.direction||b.direction||'')}<br>Status: <b>${online?'ONLINE':'OFFLINE'}</b><br>Speed: ${Number.isFinite(Number(b.speed))?(Number(b.speed)*3.6).toFixed(0)+' km/h':'—'}<br>Progress: ${prog===null?'—':prog.toFixed(0)+'%'}<br>Remaining: ${formatKm(b.route_remaining_meters)}<br>GPS accuracy: ${Number.isFinite(Number(b.accuracy))?Number(b.accuracy).toFixed(0)+' m':'—'}<br>Last seen: ${formatTime(b.last_seen||b.recorded_at)}</div>`;
  }

  function drawBuses(){
    const active=new Set();
    for(const b of buses){
      const lat=Number(b.latitude),lng=Number(b.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;
      const id=b.bus_id||String(b.id);active.add(id);const r=routeForBus(b),icon=busIcon(b,r);
      let marker=busMarkers.get(id);
      if(!marker){marker=L.marker([lat,lng],{icon,zIndexOffset:1000}).addTo(map);busMarkers.set(id,marker)}
      else{marker.setLatLng([lat,lng]);marker.setIcon(icon)}
      marker.bindPopup(popupHtml(b,r));
    }
    for(const [id,marker] of busMarkers){if(!active.has(id)){map.removeLayer(marker);busMarkers.delete(id)}}
  }

  function renderBuses(){
    const list=$('busList');list.innerHTML='';let off=0,online=0,trips=0;
    const sorted=[...buses].sort((a,b)=>String(a.bus_id||'').localeCompare(String(b.bus_id||'')));
    for(const b of sorted){
      const r=routeForBus(b),isOnline=busIsOnline(b),distance=Number(b.distance_to_route_meters);if(isOnline)online++;if(Number.isFinite(distance)&&distance>150)off++;if(b.is_active)trips++;
      const color=r?colorForRoute(r):'#475569',p=Number(b.route_progress_fraction),prog=Number.isFinite(p)?Math.max(0,Math.min(1,p))*100:null;
      const card=document.createElement('div');card.className='bus-card';
      card.innerHTML=`<div class="bus-top"><div class="bus-id" style="color:${color}">${esc(b.bus_id||'—')}</div><div class="badge ${isOnline?'online':'offline'}">${isOnline?'ONLINE':'OFFLINE'}</div></div><div class="line">${esc(r?displayName(r):'No assigned route')}</div><div class="meta">${esc(r?.direction||b.direction||'—')}<br>Speed: ${Number.isFinite(Number(b.speed))?(Number(b.speed)*3.6).toFixed(0)+' km/h':'—'} · Remaining: ${formatKm(b.route_remaining_meters)}<br>${Number.isFinite(distance)&&distance>150?'<span class="warn">⚠ Off route</span>':'Accuracy: '+(Number.isFinite(Number(b.accuracy))?Number(b.accuracy).toFixed(0)+' m':'—')}</div>${prog!==null?`<div class="progress"><div style="width:${prog}%;background:${color}"></div></div>`:''}`;
      card.onclick=()=>{const lat=Number(b.latitude),lng=Number(b.longitude);if(Number.isFinite(lat)&&Number.isFinite(lng)){map.setView([lat,lng],15,{animate:true});busMarkers.get(b.bus_id)?.openPopup()}};
      list.appendChild(card);
    }
    if(!buses.length)list.innerHTML='<div class="empty">No buses found.</div>';
    $('statTotal').textContent=buses.filter(b=>b.is_active).length;
    $('statOnline').textContent=online;$('statOffRoute').textContent=off;$('statTrips').textContent=trips;
  }

  async function loadRoutes(){
    const {data,error}=await db.from('routes').select('id,route_name,direction,region,line_number,line_code,variant,origin,destination,road_geometry,road_distance_meters,road_duration_seconds,active').eq('active',true);
    if(error)throw error;routes=data||[];routes.sort((a,b)=>String(a.region||'').localeCompare(String(b.region||''))||Number(a.line_number||999)-Number(b.line_number||999)||String(a.variant||'').localeCompare(String(b.variant||''))||String(a.direction||'').localeCompare(String(b.direction||'')));
    buildLegend();drawRoutes();
  }

  async function loadBuses(){
    const {data,error}=await db.from('bus_locations').select('*').order('bus_id');
    if(error)throw error;buses=data||[];renderBuses();drawBuses();$('updated').textContent='Updated '+formatTime(new Date().toISOString());
  }

  async function start(){
    try{initMap();}catch(e){console.error(e);showMapError(e.message);$('updated').textContent='Map error';return}
    try{await loadRoutes();await loadBuses();clearMapError();}
    catch(e){console.error(e);$('updated').textContent='Database error';showMapError('Could not load live data: '+(e.message||e));}
    setInterval(async()=>{try{await loadRoutes();await loadBuses();clearMapError();}catch(e){console.error(e);showMapError('Live update error: '+(e.message||e));}},5000);
  }

  window.addEventListener('resize',()=>map&&map.invalidateSize());
  start();
})();
</script>
</body>
</html>

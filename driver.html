<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SXM Bus Driver</title>

    <!-- Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            box-sizing: border-box;
            font-size: 16px;
            border-radius: 8px;
        }

        input,
        select {
            border: 1px solid #ccc;
            background: white;
        }

        button {
            cursor: pointer;
            border: none;
            margin-top: 20px;
            font-weight: bold;
        }

        #startButton {
            background: #2e7d32;
            color: white;
        }

        #stopButton {
            background: #c62828;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .location {
            margin-top: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .location:last-child {
            border-bottom: none;
        }

        .value {
            float: right;
            font-weight: bold;
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚌 SXM BUS</h1>

    <div class="subtitle">Driver GPS Tracking</div>

    <label for="busId">Bus ID</label>

    <input
        type="text"
        id="busId"
        value="BUS-01"
        placeholder="Example: BUS-01"
    >

    <label for="route">Route</label>

    <select id="route">
        <option value="Philipsburg → Maho">
            Philipsburg → Maho
        </option>

        <option value="Maho → Philipsburg">
            Maho → Philipsburg
        </option>

        <option value="Philipsburg → Marigot">
            Philipsburg → Marigot
        </option>

        <option value="Marigot → Philipsburg">
            Marigot → Philipsburg
        </option>

        <option value="Simpson Bay → Philipsburg">
            Simpson Bay → Philipsburg
        </option>
    </select>

    <button id="startButton">
        🟢 START TRACKING
    </button>

    <button id="stopButton">
        🔴 STOP TRACKING
    </button>

    <div id="status">
        Waiting to start...
    </div>

    <div class="location">
        Latitude:
        <span class="value" id="latitude">--</span>
        <div class="clear"></div>
    </div>

    <div class="location">
        Longitude:
        <span class="value" id="longitude">--</span>
        <div class="clear"></div>
    </div>

    <div class="location">
        Speed:
        <span class="value" id="speed">--</span>
        <div class="clear"></div>
    </div>

    <div class="location">
        Heading:
        <span class="value" id="heading">--</span>
        <div class="clear"></div>
    </div>

    <div class="location">
        Last GPS update:
        <span class="value" id="lastUpdate">--</span>
        <div class="clear"></div>
    </div>

</div>

<script>

    // ==========================================================
    // SUPABASE CONFIGURATION
    // ==========================================================

    const SUPABASE_URL =
        "https://enqyrmpdaxuelqlgevnl.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_J_P6bfidx389dnZJc3H43A_vK3ccYnW";


    // Create Supabase client
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================================
    // VARIABLES
    // ==========================================================

    let watchId = null;

    let lastUploadTime = 0;

    // Upload location approximately every 5 seconds
    const UPDATE_INTERVAL = 5000;


    // ==========================================================
    // PAGE ELEMENTS
    // ==========================================================

    const startButton =
        document.getElementById("startButton");

    const stopButton =
        document.getElementById("stopButton");

    const statusElement =
        document.getElementById("status");

    const latitudeElement =
        document.getElementById("latitude");

    const longitudeElement =
        document.getElementById("longitude");

    const speedElement =
        document.getElementById("speed");

    const headingElement =
        document.getElementById("heading");

    const lastUpdateElement =
        document.getElementById("lastUpdate");


    // ==========================================================
    // START TRACKING
    // ==========================================================

    startButton.addEventListener("click", () => {

        if (!navigator.geolocation) {

            statusElement.innerText =
                "❌ GPS is not available on this device.";

            return;
        }

        const busId =
            document.getElementById("busId").value.trim();

        if (!busId) {

            statusElement.innerText =
                "❌ Please enter a Bus ID.";

            return;
        }

        statusElement.innerText =
            "📍 Requesting GPS permission...";

        // Prevent multiple trackers
        if (watchId !== null) {

            navigator.geolocation.clearWatch(
                watchId
            );
        }

        watchId =
            navigator.geolocation.watchPosition(

                handlePosition,

                handleError,

                {
                    enableHighAccuracy: true,
                    maximumAge: 2000,
                    timeout: 15000
                }
            );

    });


    // ==========================================================
    // GPS POSITION RECEIVED
    // ==========================================================

    async function handlePosition(position) {

        const now = Date.now();

        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;

        const speed =
            position.coords.speed;

        const heading =
            position.coords.heading;


        // Display GPS information immediately

        latitudeElement.innerText =
            latitude.toFixed(6);

        longitudeElement.innerText =
            longitude.toFixed(6);


        if (
            speed !== null &&
            !isNaN(speed)
        ) {

            speedElement.innerText =
                (speed * 3.6).toFixed(1) +
                " km/h";

        } else {

            speedElement.innerText =
                "0 km/h";
        }


        if (
            heading !== null &&
            !isNaN(heading)
        ) {

            headingElement.innerText =
                heading.toFixed(0) +
                "°";

        } else {

            headingElement.innerText =
                "--";
        }


        // ======================================================
        // ONLY UPLOAD EVERY 5 SECONDS
        // ======================================================

        if (
            now - lastUploadTime <
            UPDATE_INTERVAL
        ) {

            return;
        }


        lastUploadTime = now;


        const busId =
            document
                .getElementById("busId")
                .value
                .trim();

        const route =
            document
                .getElementById("route")
                .value;


        statusElement.innerText =
            "📡 Sending GPS location...";


        // ======================================================
        // UPSERT LOCATION INTO SUPABASE
        // ======================================================

        const locationData = {

            bus_id: busId,

            latitude: latitude,

            longitude: longitude,

            speed:
                speed !== null &&
                !isNaN(speed)
                    ? speed
                    : 0,

            heading:
                heading !== null &&
                !isNaN(heading)
                    ? heading
                    : 0,

            recorded_at:
                new Date().toISOString(),

            route: route
        };


        const { data, error } =
            await supabaseClient
                .from("bus_locations")
                .upsert(

                    locationData,

                    {
                        onConflict: "bus_id"
                    }
                );


        // ======================================================
        // HANDLE DATABASE ERROR
        // ======================================================

        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            statusElement.innerText =
                "❌ Error sending GPS: " +
                error.message;

            return;
        }


        // ======================================================
        // SUCCESS
        // ======================================================

        statusElement.innerText =
            "🟢 GPS ACTIVE";

        lastUpdateElement.innerText =
            new Date().toLocaleTimeString();

    }


    // ==========================================================
    // GPS ERROR
    // ==========================================================

    function handleError(error) {

        console.error(
            "GPS error:",
            error
        );

        statusElement.innerText =
            "❌ GPS error: " +
            error.message;

    }


    // ==========================================================
    // STOP TRACKING
    // ==========================================================

    stopButton.addEventListener("click", () => {

        if (watchId !== null) {

            navigator.geolocation.clearWatch(
                watchId
            );

            watchId = null;
        }

        statusElement.innerText =
            "🔴 Tracking stopped.";

    });

</script>

</body>
</html>

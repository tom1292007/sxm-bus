.route-info {

.data-label {

.data-value {

.route-position {

.progress-bar {

    overflow: hidden;

    margin-top: 10px;
}


.progress-fill {

    height: 100%;

    width: 0%;

    background: #2563eb;

    transition: width 0.5s ease;
}


.footer {

    margin-top: 18px;

    text-align: center;

    color: #6b7280;

    font-size: 11px;

    line-height: 1.5;
}

</style>

<script>


// ==========================================================
// SUPABASE
// ==========================================================


const SUPABASE_URL =
    "https://enqyrmpdaxuelqlgevnl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_J_P6bfidx389dnZJc3H43A_vK3ccYnW";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// ==========================================================
// SETTINGS
// ==========================================================


const UPDATE_INTERVAL =
    5000;


const MAX_UPLOAD_ACCURACY_METERS =
    100;


const MAX_ROUTE_DISTANCE_METERS =
    150;



// ==========================================================
// STATE
// ==========================================================


let routes = [];

let currentRoute = null;

let watchId = null;

let isTracking = false;

let lastUploadTime = 0;



// ==========================================================
// ELEMENTS
// ==========================================================


const busIdInput =
    document.getElementById(
        "busId"
    );


const routeSelect =
    document.getElementById(
        "routeSelect"
    );


const routeInfo =
    document.getElementById(
        "routeInfo"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const latitudeElement =
    document.getElementById(
        "latitude"
    );


const longitudeElement =
    document.getElementById(
        "longitude"
    );


const speedElement =
    document.getElementById(
        "speed"
    );


const headingElement =
    document.getElementById(
        "heading"
    );


const accuracyElement =
    document.getElementById(
        "accuracy"
    );


const routeProgressElement =
    document.getElementById(
        "routeProgress"
    );


const routeRemainingElement =
    document.getElementById(
        "routeRemaining"
    );


const distanceFromRouteElement =
    document.getElementById(
        "distanceFromRoute"
    );


const routePercentElement =
    document.getElementById(
        "routePercent"
    );


const progressFill =
    document.getElementById(
        "progressFill"
    );


const lastUploadElement =
    document.getElementById(
        "lastUpload"
    );



// ==========================================================
// LOAD ROUTES
// ==========================================================


async function loadRoutes() {


    const {
        data,
        error
    } =
        await supabaseClient

            .from("routes")

            .select(
                `
                id,
                route_name,
                direction,
                active,
                region,
                line_number,
                line_code,
                variant,
                origin,
                destination,
                road_distance_meters,
                road_geometry
                `
            )

            .eq(
                "active",
                true
            )

            .order(
                "region",
                {
                    ascending: true
                }
            )

            .order(
                "line_number",
                {
                    ascending: true
                }
            )

            .order(
                "variant",
                {
                    ascending: true,
                    nullsFirst: true
                }
            );


    if (
        error
    ) {

        console.error(
            error
        );


        routeSelect.innerHTML =
            `<option value="">
                Route loading failed
            </option>`;


        setStatus(
            "❌ Could not load routes.<br>" +
            escapeHtml(
                error.message
            ),
            "error"
        );


        return;

    }


    routes =
        data || [];


    buildRouteSelector();

}



// ==========================================================
// BUILD ROUTE SELECTOR
// ==========================================================


function buildRouteSelector() {


    routeSelect.innerHTML =
        "";


    const defaultOption =
        document.createElement(
            "option"
        );


    defaultOption.value =
        "";


    defaultOption.textContent =
        "Select your route";


    routeSelect.appendChild(
        defaultOption
    );


    const groups = {};


    routes.forEach(
        route => {


            const region =
                route.region ||
                "Other";


            const line =
                route.line_number ||
                999;


            const lineCode =
                route.line_code ||
                `LINE-${line}`;


            const key =
                `${region}-${lineCode}`;


            if (
                !groups[key]
            ) {

                groups[key] = {

                    region:
                        region,

                    line:
                        line,

                    routes:
                        []

                };

            }


            groups[key]
                .routes
                .push(route);

        }
    );


    const sortedGroups =
        Object.values(
            groups
        )
        .sort(
            (a, b) => {


                if (
                    a.region !==
                    b.region
                ) {

                    return a.region ===
                        "Dutch Side"
                        ? -1
                        : 1;

                }


                return a.line -
                    b.line;

            }
        );


    sortedGroups.forEach(
        group => {


            const optgroup =
                document.createElement(
                    "optgroup"
                );


            if (
                group.region ===
                "Dutch Side"
            ) {

                optgroup.label =
                    `🇸🇽 Line ${group.line}`;

            }

            else if (
                group.region ===
                "French Side"
            ) {

                optgroup.label =
                    `🇫🇷 ${
                        getFrenchGroupName(
                            group.routes
                        )
                    }`;

            }

            else {

                optgroup.label =
                    group.region;

            }


            group.routes
                .sort(
                    compareRoutes
                )
                .forEach(
                    route => {


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            route.id;


                        option.textContent =
                            route.variant

                                ? `${route.variant} — ${route.direction}`

                                : route.direction;


                        optgroup.appendChild(
                            option
                        );

                    }
                );


            routeSelect.appendChild(
                optgroup
            );

        }
    );

}



// ==========================================================
// ROUTE SORT
// ==========================================================


function compareRoutes(
    a,
    b
) {


    const av =
        a.variant || "";


    const bv =
        b.variant || "";


    if (
        av !== bv
    ) {

        return av.localeCompare(
            bv
        );

    }


    return (
        a.direction || ""
    )
    .localeCompare(
        b.direction || ""
    );

}



// ==========================================================
// FRENCH GROUP
// ==========================================================


function getFrenchGroupName(
    routes
) {


    if (
        !routes.length
    ) {

        return "Routes";

    }


    return (
        routes[0]
            .route_name ||
        "Routes"
    )
    .replace(
        "French Side - ",
        ""
    );

}



// ==========================================================
// ROUTE SELECTION
// ==========================================================


routeSelect.addEventListener(
    "change",
    () => {


        const routeId =
            routeSelect.value;


        currentRoute =
            routes.find(

                route =>

                    String(
                        route.id
                    ) ===

                    String(
                        routeId
                    )

            ) || null;


        if (
            !currentRoute
        ) {

            routeInfo.classList.remove(
                "visible"
            );

            return;

        }


        routeInfo.classList.add(
            "visible"
        );


        const distance =
            Number(
                currentRoute
                    .road_distance_meters
            ) || 0;


        routeInfo.innerHTML = `

            <strong>
                ${escapeHtml(
                    currentRoute.route_name
                )}
            </strong>

            <br>

            ${escapeHtml(
                currentRoute.direction
            )}

            ${
                distance
                    ? `<br>
                       Road distance:
                       ${(distance / 1000).toFixed(1)}
                       km`
                    : ""
            }

        `;

    }
);



// ==========================================================
// START
// ==========================================================


startButton.addEventListener(
    "click",
    startTracking
);


async function startTracking() {


    if (
        isTracking
    ) {

        return;

    }


    const busId =
        busIdInput.value.trim();


    if (
        !busId
    ) {

        setStatus(
            "❌ Enter a Bus ID.",
            "error"
        );

        return;

    }


    if (
        !currentRoute
    ) {

        setStatus(
            "❌ Select a route.",
            "error"
        );

        return;

    }


    if (
        !currentRoute.road_geometry
    ) {

        setStatus(
            "❌ This route does not have road geometry yet.",
            "error"
        );

        return;

    }


    if (
        !navigator.geolocation
    ) {

        setStatus(
            "❌ GPS is not available.",
            "error"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

    }


    isTracking =
        true;


    lastUploadTime =
        0;


    startButton.disabled =
        true;


    stopButton.disabled =
        false;


    busIdInput.disabled =
        true;


    routeSelect.disabled =
        true;


    setStatus(
        "📍 Starting GPS...",
        "warning"
    );


    watchId =
        navigator.geolocation.watchPosition(

            handlePosition,

            handleGpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    2000,

                timeout:
                    15000

            }

        );


    await setBusActive(
        true
    );

}



// ==========================================================
// GPS POSITION
// ==========================================================


async function handlePosition(
    position
) {


    const coords =
        position.coords;


    const lat =
        coords.latitude;


    const lng =
        coords.longitude;


    const speedMs =
        coords.speed;


    const heading =
        coords.heading;


    const accuracy =
        coords.accuracy;


    latitudeElement.innerText =
        lat.toFixed(
            6
        );


    longitudeElement.innerText =
        lng.toFixed(
            6
        );


    speedElement.innerText =

        speedMs !== null &&
        Number.isFinite(
            speedMs
        )

            ? (
                speedMs * 3.6
            ).toFixed(1) +
              " km/h"

            : "0 km/h";


    headingElement.innerText =

        heading !== null &&
        Number.isFinite(
            heading
        )

            ? heading.toFixed(0) +
              "°"

            : "--";


    accuracyElement.innerText =

        Number.isFinite(
            accuracy
        )

            ? Math.round(
                accuracy
            ) + " m"

            : "--";


    // ======================================================
    // THROTTLE UPLOAD
    // ======================================================


    const now =
        Date.now();


    if (
        now -
        lastUploadTime <
        UPDATE_INTERVAL
    ) {

        return;

    }


    // ======================================================
    // GPS QUALITY
    // ======================================================


    if (
        Number.isFinite(
            accuracy
        ) &&
        accuracy >
        MAX_UPLOAD_ACCURACY_METERS
    ) {

        setStatus(
            `⚠️ GPS accuracy is ${
                Math.round(
                    accuracy
                )
            } m. Waiting for better GPS...`,
            "warning"
        );

        return;

    }


    // ======================================================
    // CALCULATE ROUTE POSITION
    // ======================================================


    const routePosition =
        calculateRoutePosition(

            lat,

            lng,

            currentRoute.road_geometry

        );


    if (
        !routePosition
    ) {

        setStatus(
            "⚠️ Could not determine route position.",
            "warning"
        );

        return;

    }


    // ======================================================
    // UPDATE UI
    // ======================================================


    showRoutePosition(
        routePosition
    );


    lastUploadTime =
        now;


    // ======================================================
    // UPLOAD
    // ======================================================


    await uploadLocation(

        position,

        routePosition

    );

}



// ==========================================================
// CALCULATE POSITION ON ROUTE
// ==========================================================


function calculateRoutePosition(
    lat,
    lng,
    geometry
) {


    if (
        !geometry ||
        geometry.type !==
        "LineString"
    ) {

        return null;

    }


    const coordinates =
        geometry.coordinates;


    if (
        !Array.isArray(
            coordinates
        ) ||
        coordinates.length < 2
    ) {

        return null;

    }


    let best = null;


    let cumulativeDistance =
        0;


    for (
        let i = 0;
        i < coordinates.length - 1;
        i++
    ) {


        const start =
            coordinates[i];


        const end =
            coordinates[i + 1];


        const segmentLength =
            haversineDistance(

                start[1],
                start[0],

                end[1],
                end[0]

            );


        const projection =
            projectPointOnSegment(

                lat,
                lng,

                start[1],
                start[0],

                end[1],
                end[0]

            );


        const distanceToProjection =
            haversineDistance(

                lat,
                lng,

                projection.lat,
                projection.lng

            );


        if (
            !best ||
            distanceToProjection <
            best.distanceToRoute
        ) {


            const distanceAlongSegment =
                haversineDistance(

                    start[1],
                    start[0],

                    projection.lat,
                    projection.lng

                );


            best = {

                lat:
                    projection.lat,

                lng:
                    projection.lng,

                distanceToRoute:
                    distanceToProjection,

                progress:
                    cumulativeDistance +
                    distanceAlongSegment,

                segmentIndex:
                    i

            };

        }


        cumulativeDistance +=
            segmentLength;

    }


    const totalDistance =
        cumulativeDistance;


    const progress =
        Math.max(

            0,

            Math.min(

                totalDistance,

                best.progress

            )

        );


    const remaining =
        Math.max(

            0,

            totalDistance -
            progress

        );


    const fraction =
        totalDistance > 0

            ? progress /
              totalDistance

            : 0;


    return {

        positionLat:
            best.lat,

        positionLng:
            best.lng,

        distanceToRoute:
            best.distanceToRoute,

        progress:
            progress,

        remaining:
            remaining,

        fraction:
            fraction

    };

}



// ==========================================================
// PROJECT GPS POINT ON A LINE SEGMENT
// ==========================================================


function projectPointOnSegment(

    lat,
    lng,

    lat1,
    lng1,

    lat2,
    lng2

) {


    const averageLatitude =
        (
            lat +
            lat1 +
            lat2
        ) / 3;


    const latitudeRadians =
        degreesToRadians(
            averageLatitude
        );


    const metersPerDegreeLat =
        110540;


    const metersPerDegreeLng =
        111320 *
        Math.cos(
            latitudeRadians
        );


    const px =
        (
            lng -
            lng1
        ) *
        metersPerDegreeLng;


    const py =
        (
            lat -
            lat1
        ) *
        metersPerDegreeLat;


    const vx =
        (
            lng2 -
            lng1
        ) *
        metersPerDegreeLng;


    const vy =
        (
            lat2 -
            lat1
        ) *
        metersPerDegreeLat;


    const lengthSquared =
        vx * vx +
        vy * vy;


    if (
        lengthSquared === 0
    ) {

        return {

            lat:
                lat1,

            lng:
                lng1

        };

    }


    let t =
        (
            px * vx +
            py * vy
        ) /
        lengthSquared;


    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );


    return {

        lat:
            lat1 +
            (
                lat2 -
                lat1
            ) *
            t,

        lng:
            lng1 +
            (
                lng2 -
                lng1
            ) *
            t

    };

}



// ==========================================================
// HAVERSINE
// ==========================================================


function haversineDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {


    const R =
        6371000;


    const dLat =
        degreesToRadians(
            lat2 -
            lat1
        );


    const dLon =
        degreesToRadians(
            lon2 -
            lon1
        );


    const a =
        Math.sin(
            dLat / 2
        ) ** 2 +

        Math.cos(
            degreesToRadians(
                lat1
            )
        ) *

        Math.cos(
            degreesToRadians(
                lat2
            )
        ) *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =
        2 *
        Math.atan2(

            Math.sqrt(
                a
            ),

            Math.sqrt(
                1 - a
            )

        );


    return R * c;

}



// ==========================================================
// DEGREES
// ==========================================================


function degreesToRadians(
    degrees
) {

    return (
        degrees *
        Math.PI /
        180
    );

}



// ==========================================================
// SHOW ROUTE POSITION
// ==========================================================


function showRoutePosition(
    result
) {


    routeProgressElement.innerText =
        formatDistance(
            result.progress
        );


    routeRemainingElement.innerText =
        formatDistance(
            result.remaining
        );


    distanceFromRouteElement.innerText =
        formatDistance(
            result.distanceToRoute
        );


    const percent =
        result.fraction *
        100;


    routePercentElement.innerText =
        percent.toFixed(
            1
        ) + "%";


    progressFill.style.width =
        Math.max(

            0,

            Math.min(

                100,

                percent

            )

        ) + "%";


    if (
        result.distanceToRoute >
        MAX_ROUTE_DISTANCE_METERS
    ) {

        setStatus(

            `⚠️ Bus is ${
                Math.round(
                    result.distanceToRoute
                )
            } m from the mapped route.`,

            "warning"

        );

    }

    else {

        setStatus(
            "🟢 GPS ACTIVE",
            "active"
        );

    }

}



// ==========================================================
// UPLOAD LOCATION
// ==========================================================


async function uploadLocation(
    position,
    routePosition
) {


    const coords =
        position.coords;


    const busId =
        busIdInput.value.trim();


    const speed =

        coords.speed !== null &&
        Number.isFinite(
            coords.speed
        )

            ? coords.speed * 3.6

            : 0;


    const heading =

        coords.heading !== null &&
        Number.isFinite(
            coords.heading
        )

            ? coords.heading

            : 0;


    const accuracy =

        Number.isFinite(
            coords.accuracy
        )

            ? coords.accuracy

            : null;


    const nowIso =
        new Date()
            .toISOString();


    const locationData = {

        bus_id:
            busId,

        latitude:
            coords.latitude,

        longitude:
            coords.longitude,

        speed:
            speed,

        heading:
            heading,

        accuracy_meters:
            accuracy,

        recorded_at:
            nowIso,

        last_seen:
            nowIso,

        route_id:
            Number(
                currentRoute.id
            ),

        route:
            `${currentRoute.route_name} — ${currentRoute.direction}`,

        is_active:
            true,

        route_progress_meters:
            routePosition.progress,

        route_remaining_meters:
            routePosition.remaining,

        distance_to_route_meters:
            routePosition.distanceToRoute,

        route_position_lat:
            routePosition.positionLat,

        route_position_lng:
            routePosition.positionLng,

        route_progress_fraction:
            routePosition.fraction,

        route_position_updated_at:
            nowIso

    };


    const {
        error
    } =
        await supabaseClient

            .from(
                "bus_locations"
            )

            .upsert(

                locationData,

                {
                    onConflict:
                        "bus_id"
                }

            );


    if (
        error
    ) {

        console.error(
            "GPS upload error:",
            error
        );


        setStatus(
            "❌ GPS upload failed:<br>" +
            escapeHtml(
                error.message
            ),
            "error"
        );


        return;

    }


}



// ==========================================================
// SET BUS ACTIVE / INACTIVE
// ==========================================================


async function setBusActive(
    active
) {


    const busId =
        busIdInput.value.trim();


    if (
        !busId ||
        !currentRoute
    ) {

        return;

    }


    const now =
        new Date()
            .toISOString();


    const data = {

        bus_id:
            busId,

        route_id:
            Number(
                currentRoute.id
            ),

        route:
            `${currentRoute.route_name} — ${currentRoute.direction}`,

        is_active:
            active

    };


    if (
        active
    ) {

        data.last_seen =
            now;

        data.trip_started_at =
            now;

    }

    else {

        data.trip_ended_at =
            now;

    }


    const {
        error
    } =
        await supabaseClient

            .from(
                "bus_locations"
            )

            .upsert(

                data,

                {
                    onConflict:
                        "bus_id"
                }

            );


    if (
        error
    ) {

        console.error(
            "Status update error:",
            error
        );

    }

}



// ==========================================================
// STOP
// ==========================================================


stopButton.addEventListener(
    "click",
    stopTracking
);


async function stopTracking() {


    if (
        !isTracking
    ) {

        return;

    }


    isTracking =
        false;


    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId =
            null;

    }


    await setBusActive(
        false
    );


    startButton.disabled =
        false;


    stopButton.disabled =
        true;


    busIdInput.disabled =
        false;


    routeSelect.disabled =
        false;


    setStatus(
        "🔴 Tracking stopped.",
        "warning"
    );

}



// ==========================================================
// GPS ERROR
// ==========================================================


function handleGpsError(
    error
) {


    console.error(
        error
    );


    let message =
        "GPS error.";


    if (
        error.code === 1
    ) {

        message =
            "Location permission was denied.";

    }

    else if (
        error.code === 2
    ) {

        message =
            "Your location could not be determined.";

    }

    else if (
        error.code === 3
    ) {

        message =
            "GPS request timed out.";

    }


    setStatus(
        "❌ " + message,
        "error"
    );

}



// ==========================================================
// STATUS
// ==========================================================


function setStatus(
    message,
    type
) {


    statusElement.innerHTML =
        message;


    statusElement.className =
        "status";


    if (
        type === "active"
    ) {

        statusElement.classList.add(
            "status-active"
        );

    }


    else if (
        type === "warning"
    ) {

        statusElement.classList.add(
            "status-warning"
        );

    }


    else if (
        type === "error"
    ) {

        statusElement.classList.add(
            "status-error"
        );

    }

}



// ==========================================================
// FORMAT DISTANCE
// ==========================================================


function formatDistance(
    meters
) {


    if (
        meters < 1000
    ) {

        return Math.round(
            meters
        ) + " m";

    }


    return (
        meters / 1000
    )
    .toFixed(2) +
    " km";

}



// ==========================================================
// HTML ESCAPE
// ==========================================================


function escapeHtml(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================================
// INITIALIZE
// ==========================================================


loadRoutes();



// ==========================================================
// CLEANUP
// ==========================================================


window.addEventListener(
    "beforeunload",
    () => {

        if (
            watchId !== null
        ) {

            navigator.geolocation.clearWatch(
                watchId
            );

        }

    }
);

</script>

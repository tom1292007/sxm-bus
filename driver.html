<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>SXM Bus Driver</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    background: #f3f4f6;

    color: #111827;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


.container {

    width: 100%;

    max-width: 500px;

    margin: auto;

    background: white;

    padding: 24px;

    border-radius: 18px;

    box-shadow:
        0 4px 20px
        rgba(0,0,0,0.10);
}


h1 {

    margin: 0;

    text-align: center;

    font-size: 28px;
}


.subtitle {

    text-align: center;

    color: #6b7280;

    font-size: 14px;

    margin-top: 5px;

    margin-bottom: 25px;
}


label {

    display: block;

    font-size: 14px;

    font-weight: bold;

    margin-top: 15px;

    margin-bottom: 6px;
}


input,
select,
button {

    width: 100%;

    font-size: 16px;

    padding: 15px;

    border-radius: 10px;

    font-family: inherit;
}


input,
select {

    background: white;

    border: 1px solid #d1d5db;
}


button {

    border: none;

    cursor: pointer;

    font-weight: bold;
}


#startButton {

    background: #16a34a;

    color: white;

    margin-top: 25px;
}


#stopButton {

    background: #dc2626;

    color: white;

    margin-top: 10px;
}


button:disabled {

    opacity: 0.45;

    cursor: not-allowed;
}


.status {

    margin-top: 18px;

    padding: 15px;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;

    line-height: 1.5;
}


.status-active {

    background: #dcfce7;

    color: #166534;
}


.status-warning {

    background: #fef3c7;

    color: #92400e;
}


.status-error {

    background: #fee2e2;

    color: #991b1b;
}


.route-info {

    display: none;

    margin-top: 12px;

    padding: 12px;

    border-left: 4px solid #2563eb;

    background: #f8fafc;

    border-radius: 8px;

    font-size: 13px;

    line-height: 1.5;
}


.route-info.visible {

    display: block;
}


.gps-section {

    margin-top: 25px;
}


.data-row {

    display: flex;

    justify-content: space-between;

    padding: 10px 0;

    border-bottom: 1px solid #e5e7eb;

    font-size: 14px;
}


.data-label {

    color: #6b7280;
}


.data-value {

    font-weight: bold;

    text-align: right;
}


.footer {

    margin-top: 18px;

    text-align: center;

    color: #6b7280;

    font-size: 11px;

    line-height: 1.5;
}

</style>

</head>


<body>


<div class="container">


    <h1>🚌 SXM BUS</h1>

    <div class="subtitle">
        Driver GPS Tracking
    </div>


    <!-- ==================================================
         BUS ID
    =================================================== -->


    <label for="busId">

        Bus ID

    </label>


    <input
        id="busId"
        value="BUS_01"
        autocomplete="off"
        placeholder="BUS_01"
    >


    <!-- ==================================================
         ROUTE
    =================================================== -->


    <label for="routeSelect">

        Select Route

    </label>


    <select id="routeSelect">

        <option value="">

            Loading routes...

        </option>

    </select>


    <div
        id="routeInfo"
        class="route-info"
    ></div>


    <!-- ==================================================
         BUTTONS
    =================================================== -->


    <button
        id="startButton"
    >

        🟢 START TRACKING

    </button>


    <button
        id="stopButton"
        disabled
    >

        🔴 STOP TRACKING

    </button>


    <!-- ==================================================
         STATUS
    =================================================== -->


    <div
        id="status"
        class="status status-warning"
    >

        Waiting to start...

    </div>


    <!-- ==================================================
         GPS INFORMATION
    =================================================== -->


    <div class="gps-section">


        <div class="data-row">

            <span class="data-label">
                Latitude
            </span>

            <span
                id="latitude"
                class="data-value"
            >
                --
            </span>

        </div>


        <div class="data-row">

            <span class="data-label">
                Longitude
            </span>

            <span
                id="longitude"
                class="data-value"
            >
                --
            </span>

        </div>


        <div class="data-row">

            <span class="data-label">
                Speed
            </span>

            <span
                id="speed"
                class="data-value"
            >
                --
            </span>

        </div>


        <div class="data-row">

            <span class="data-label">
                Heading
            </span>

            <span
                id="heading"
                class="data-value"
            >
                --
            </span>

        </div>


        <div class="data-row">

            <span class="data-label">
                GPS Accuracy
            </span>

            <span
                id="accuracy"
                class="data-value"
            >
                --
            </span>

        </div>


        <div class="data-row">

            <span class="data-label">
                Last Upload
            </span>

            <span
                id="lastUpload"
                class="data-value"
            >
                --
            </span>

        </div>


    </div>


    <div class="footer">

        Keep this page open while driving.<br>

        Your phone must allow location access.

    </div>


</div>



<script>


// ==========================================================
// SUPABASE
// ==========================================================


const SUPABASE_URL =
    "https://enqyrmpdaxuelqlgevnl.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_J_P6bfidx389dnZJc3H43A_vK3ccYnW";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// ==========================================================
// SETTINGS
// ==========================================================


const UPDATE_INTERVAL =
    5000;


const MAX_UPLOAD_ACCURACY_METERS =
    100;



// ==========================================================
// STATE
// ==========================================================


let routes = [];

let currentRoute = null;

let watchId = null;

let isTracking = false;

let lastUploadTime = 0;



// ==========================================================
// ELEMENTS
// ==========================================================


const busIdInput =
    document.getElementById(
        "busId"
    );


const routeSelect =
    document.getElementById(
        "routeSelect"
    );


const routeInfo =
    document.getElementById(
        "routeInfo"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const latitudeElement =
    document.getElementById(
        "latitude"
    );


const longitudeElement =
    document.getElementById(
        "longitude"
    );


const speedElement =
    document.getElementById(
        "speed"
    );


const headingElement =
    document.getElementById(
        "heading"
    );


const accuracyElement =
    document.getElementById(
        "accuracy"
    );


const lastUploadElement =
    document.getElementById(
        "lastUpload"
    );



// ==========================================================
// LOAD ROUTES
// ==========================================================


async function loadRoutes() {


    const {
        data,
        error
    } =
        await supabaseClient

            .from("routes")

            .select(
                `
                id,
                route_name,
                direction,
                active,
                region,
                line_number,
                line_code,
                variant,
                origin,
                destination,
                road_distance_meters
                `
            )

            .eq(
                "active",
                true
            )

            .order(
                "region",
                {
                    ascending: true
                }
            )

            .order(
                "line_number",
                {
                    ascending: true
                }
            )

            .order(
                "variant",
                {
                    ascending: true,
                    nullsFirst: true
                }
            )

            .order(
                "direction",
                {
                    ascending: true
                }
            );


    if (
        error
    ) {

        console.error(
            error
        );


        routeSelect.innerHTML =
            `<option value="">
                Route loading failed
            </option>`;


        setStatus(
            "❌ Could not load routes.<br>" +
            escapeHtml(
                error.message
            ),
            "error"
        );


        return;

    }


    routes =
        data || [];


    buildRouteSelector();


}



// ==========================================================
// BUILD ROUTE SELECTOR
// ==========================================================


function buildRouteSelector() {


    routeSelect.innerHTML = "";


    const defaultOption =
        document.createElement(
            "option"
        );


    defaultOption.value =
        "";


    defaultOption.textContent =
        "Select your route";


    routeSelect.appendChild(
        defaultOption
    );


    const grouped = {};


    routes.forEach(
        route => {


            const region =
                route.region ||
                "Other";


            const line =
                route.line_number ||
                999;


            const lineCode =
                route.line_code ||
                `LINE-${line}`;


            const key =
                `${region}-${lineCode}`;


            if (
                !grouped[key]
            ) {

                grouped[key] = {

                    region:
                        region,

                    line:
                        line,

                    lineCode:
                        lineCode,

                    routes:
                        []

                };

            }


            grouped[key]
                .routes
                .push(route);

        }
    );


    const groups =
        Object.values(
            grouped
        );


    groups.sort(
        (a, b) => {

            if (
                a.region !==
                b.region
            ) {

                return a.region ===
                    "Dutch Side"
                    ? -1
                    : 1;

            }

            return a.line - b.line;

        }
    );


    let previousRegion =
        null;


    groups.forEach(
        group => {


            if (
                previousRegion !==
                group.region
            ) {


                if (
                    previousRegion !==
                    null
                ) {

                    const separator =
                        document.createElement(
                            "option"
                        );


                    separator.disabled =
                        true;


                    separator.textContent =
                        "────────────────";

                    routeSelect.appendChild(
                        separator
                    );

                }


                previousRegion =
                    group.region;

            }


            const optgroup =
                document.createElement(
                    "optgroup"
                );


            optgroup.label =

                group.region ===
                "Dutch Side"

                    ? `🇸🇽 Line ${group.line}`

                    : `🇫🇷 ${
                        getFrenchGroupName(
                            group.routes
                        )
                    }`;


            const sortedRoutes =
                [...group.routes]
                    .sort(
                        compareRoutes
                    );


            sortedRoutes.forEach(
                route => {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        route.id;


                    option.textContent =
                        makeRouteLabel(
                            route,
                            sortedRoutes
                        );


                    optgroup.appendChild(
                        option
                    );

                }
            );


            routeSelect.appendChild(
                optgroup
            );

        }
    );

}



// ==========================================================
// ROUTE LABEL
// ==========================================================


function makeRouteLabel(
    route,
    routesInGroup
) {


    if (
        route.variant
    ) {

        return `${route.variant} — ${route.direction}`;

    }


    return route.direction;

}



// ==========================================================
// FRENCH GROUP NAME
// ==========================================================


function getFrenchGroupName(
    routesInGroup
) {


    if (
        routesInGroup.length === 0
    ) {

        return "Routes";

    }


    const routeName =
        routesInGroup[0]
            .route_name ||
            "Routes";


    return routeName
        .replace(
            "French Side - ",
            ""
        );

}



// ==========================================================
// SORT ROUTES
// ==========================================================


function compareRoutes(
    a,
    b
) {


    const aVariant =
        a.variant || "";


    const bVariant =
        b.variant || "";


    if (
        aVariant !==
        bVariant
    ) {

        return aVariant
            .localeCompare(
                bVariant
            );

    }


    return (
        a.direction || ""
    )
    .localeCompare(
        b.direction || ""
    );

}



// ==========================================================
// ROUTE SELECTED
// ==========================================================


routeSelect.addEventListener(
    "change",
    () => {


        const routeId =
            routeSelect.value;


        currentRoute =
            routes.find(

                route =>

                    String(
                        route.id
                    ) ===
                    String(
                        routeId
                    )

            ) || null;


        if (
            !currentRoute
        ) {

            routeInfo.classList.remove(
                "visible"
            );

            return;

        }


        routeInfo.classList.add(
            "visible"
        );


        const distance =
            currentRoute
                .road_distance_meters;


        routeInfo.innerHTML = `

            <strong>
                ${escapeHtml(
                    currentRoute.route_name
                )}
            </strong>

            <br>

            ${escapeHtml(
                currentRoute.direction
            )}

            ${
                distance
                    ? `<br>
                       Road distance:
                       ${(distance / 1000).toFixed(1)}
                       km`
                    : ""
            }

        `;

    }
);



// ==========================================================
// START TRACKING
// ==========================================================


startButton.addEventListener(
    "click",
    startTracking
);


async function startTracking() {


    if (
        isTracking
    ) {

        return;

    }


    const busId =
        busIdInput.value.trim();


    if (
        !busId
    ) {

        setStatus(
            "❌ Enter a Bus ID.",
            "error"
        );

        return;

    }


    if (
        !currentRoute
    ) {

        setStatus(
            "❌ Select a route.",
            "error"
        );

        return;

    }


    if (
        !navigator.geolocation
    ) {

        setStatus(
            "❌ GPS is not available.",
            "error"
        );

        return;

    }


    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

    }


    isTracking =
        true;


    lastUploadTime =
        0;


    startButton.disabled =
        true;


    stopButton.disabled =
        false;


    busIdInput.disabled =
        true;


    routeSelect.disabled =
        true;


    setStatus(
        "📍 Requesting GPS permission...",
        "warning"
    );


    watchId =
        navigator.geolocation.watchPosition(

            handlePosition,

            handleGpsError,

            {

                enableHighAccuracy:
                    true,

                maximumAge:
                    2000,

                timeout:
                    15000

            }

        );


    await setBusActive(
        true
    );

}



// ==========================================================
// GPS POSITION
// ==========================================================


async function handlePosition(
    position
) {


    const coords =
        position.coords;


    const latitude =
        coords.latitude;


    const longitude =
        coords.longitude;


    const speedMs =
        coords.speed;


    const heading =
        coords.heading;


    const accuracy =
        coords.accuracy;


    latitudeElement.innerText =
        latitude.toFixed(
            6
        );


    longitudeElement.innerText =
        longitude.toFixed(
            6
        );


    speedElement.innerText =

        speedMs !== null &&
        Number.isFinite(
            speedMs
        )

            ? `${(
                speedMs * 3.6
            ).toFixed(1)} km/h`

            : "0 km/h";


    headingElement.innerText =

        heading !== null &&
        Number.isFinite(
            heading
        )

            ? `${heading.toFixed(0)}°`

            : "--";


    accuracyElement.innerText =

        Number.isFinite(
            accuracy
        )

            ? `${Math.round(
                accuracy
            )} m`

            : "--";


    const now =
        Date.now();


    if (
        now -
        lastUploadTime <
        UPDATE_INTERVAL
    ) {

        return;

    }


    if (
        Number.isFinite(
            accuracy
        ) &&
        accuracy >
        MAX_UPLOAD_ACCURACY_METERS
    ) {

        setStatus(
            `⚠️ GPS accuracy is ${Math.round(
                accuracy
            )} m. Waiting for better GPS...`,
            "warning"
        );

        return;

    }


    lastUploadTime =
        now;


    await uploadLocation(
        position
    );

}



// ==========================================================
// UPLOAD LOCATION
// ==========================================================


async function uploadLocation(
    position
) {


    const coords =
        position.coords;


    const busId =
        busIdInput.value.trim();


    const speed =

        coords.speed !== null &&
        Number.isFinite(
            coords.speed
        )

            ? coords.speed * 3.6

            : 0;


    const heading =

        coords.heading !== null &&
        Number.isFinite(
            coords.heading
        )

            ? coords.heading

            : 0;


    const accuracy =

        Number.isFinite(
            coords.accuracy
        )

            ? coords.accuracy

            : null;


    const timestamp =
        new Date()
            .toISOString();


    const locationData = {

        bus_id:
            busId,

        latitude:
            coords.latitude,

        longitude:
            coords.longitude,

        speed:
            speed,

        heading:
            heading,

        accuracy_meters:
            accuracy,

        recorded_at:
            timestamp,

        last_seen:
            timestamp,

        route_id:
            Number(
                currentRoute.id
            ),

        route:
            `${currentRoute.route_name} — ${currentRoute.direction}`,

        is_active:
            true

    };


    const {
        error
    } =
        await supabaseClient

            .from(
                "bus_locations"
            )

            .upsert(

                locationData,

                {
                    onConflict:
                        "bus_id"
                }

            );


    if (
        error
    ) {

        console.error(
            error
        );


        setStatus(
            "❌ GPS upload failed:<br>" +
            escapeHtml(
                error.message
            ),
            "error"
        );


        return;

    }


    lastUploadElement.innerText =
        new Date()
            .toLocaleTimeString();


    setStatus(
        "🟢 GPS ACTIVE",
        "active"
    );

}



// ==========================================================
// BUS STATUS
// ==========================================================


async function setBusActive(
    active
) {


    const busId =
        busIdInput.value.trim();


    if (
        !busId ||
        !currentRoute
    ) {

        return;

    }


    const now =
        new Date()
            .toISOString();


    const data = {

        bus_id:
            busId,

        route_id:
            Number(
                currentRoute.id
            ),

        route:
            `${currentRoute.route_name} — ${currentRoute.direction}`,

        is_active:
            active

    };


    if (
        active
    ) {

        data.last_seen =
            now;

        data.trip_started_at =
            now;

    }

    else {

        data.trip_ended_at =
            now;

    }


    const {
        error
    } =
        await supabaseClient

            .from(
                "bus_locations"
            )

            .upsert(

                data,

                {
                    onConflict:
                        "bus_id"
                }

            );


    if (
        error
    ) {

        console.error(
            error
        );

    }

}



// ==========================================================
// STOP TRACKING
// ==========================================================


stopButton.addEventListener(
    "click",
    stopTracking
);


async function stopTracking() {


    if (
        !isTracking
    ) {

        return;

    }


    isTracking =
        false;


    if (
        watchId !== null
    ) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId =
            null;

    }


    await setBusActive(
        false
    );


    startButton.disabled =
        false;


    stopButton.disabled =
        true;


    busIdInput.disabled =
        false;


    routeSelect.disabled =
        false;


    setStatus(
        "🔴 Tracking stopped.",
        "warning"
    );

}



// ==========================================================
// GPS ERROR
// ==========================================================


function handleGpsError(
    error
) {


    console.error(
        error
    );


    let message =
        "GPS error.";


    if (
        error.code === 1
    ) {

        message =
            "Location permission was denied.";

    }


    else if (
        error.code === 2
    ) {

        message =
            "Your location could not be determined.";

    }


    else if (
        error.code === 3
    ) {

        message =
            "GPS request timed out.";

    }


    setStatus(
        "❌ " + message,
        "error"
    );

}



// ==========================================================
// STATUS
// ==========================================================


function setStatus(
    message,
    type
) {


    statusElement.innerHTML =
        message;


    statusElement.className =
        "status";


    if (
        type ===
        "active"
    ) {

        statusElement.classList.add(
            "status-active"
        );

    }


    if (
        type ===
        "warning"
    ) {

        statusElement.classList.add(
            "status-warning"
        );

    }


    if (
        type ===
        "error"
    ) {

        statusElement.classList.add(
            "status-error"
        );

    }

}



// ==========================================================
// ESCAPE HTML
// ==========================================================


function escapeHtml(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================================
// INITIALIZE
// ==========================================================


loadRoutes();



// ==========================================================
// CLEAN UP
// ==========================================================


window.addEventListener(
    "beforeunload",
    () => {

        if (
            watchId !== null
        ) {

            navigator.geolocation.clearWatch(
                watchId
            );

        }

    }
);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SXM Bus</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root{--bg:#f5f8fc;--card:#fff;--text:#112033;--muted:#65758b;--border:#dce4ee;--accent:#2563eb;}
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    header{background:#0c1728;color:white;padding:16px;position:sticky;top:0;z-index:1001}.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:800}.tag{font-size:11px;background:rgba(255,255,255,.1);padding:6px 9px;border-radius:999px}.sub{font-size:12px;color:#b7c4d6;margin-top:3px}
    #map{height:54vh;min-height:390px;width:100%;background:#e9eef5}.panel{max-width:1000px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
    button{border:0;border-radius:11px;padding:11px 13px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.primary:disabled{opacity:.6;cursor:not-allowed}
    .gps-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.gps-status{font-size:12px;color:var(--muted)}
    .nearby-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.small{font-size:11px;color:var(--muted)}
    .bus{border:1px solid var(--border);border-radius:12px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}.bus-main{min-width:0}.bus-id{font-weight:800}.bus-route{font-size:12px;color:var(--muted);margin-top:3px}.eta{font-size:19px;font-weight:800;white-space:nowrap}.eta span{display:block;font-size:10px;color:var(--muted);font-weight:600;text-align:right}
    .note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}.legend{display:flex;flex-wrap:wrap;gap:8px}.legend-item{font-size:11px;display:flex;align-items:center;gap:5px;background:#f4f7fb;border-radius:999px;padding:6px 8px}.dot{width:18px;height:5px;border-radius:99px}
    .map-error{display:none;margin-top:8px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:9px;font-size:12px}
    @media(min-width:900px){#map{height:58vh}.desktop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
  </style>
</head>
<body>
<header><div class="title-row"><div><div class="brand">🚌 SXM Bus</div><div class="sub">Find the next bus near you</div></div><div class="tag">Live</div></div></header>
<div id="map"></div>
<div class="panel">
  <div class="card">
    <div class="gps-row"><button class="primary" id="locateBtn">Use My Location</button><div class="gps-status" id="gpsStatus">Location not yet selected</div></div>
    <div class="note">There are no fixed bus stops. The app uses your current location as your pickup point and finds buses approaching your position.</div>
    <div id="mapError" class="map-error"></div>
  </div>
  <div class="desktop-grid">
    <div class="card"><div class="nearby-title"><b>Nearby buses</b><span class="small" id="nearbyHint">Allow location for ETAs</span></div><div id="busResults"><div class="small" style="margin-top:8px">Waiting for live buses…</div></div></div>
    <div class="card"><div class="nearby-title"><b>Routes</b><span class="small">Colors match the map</span></div><div class="legend" id="legend"></div></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  'use strict';
  const SUPABASE_URL='https://enqyrmpdaxuelqlgevnl.supabase.co';
  const SUPABASE_KEY='sb_publishable_J_P6bfidx389dnZJc3H43A_vK3ccYnW';
  const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const LINE_COLORS={L1:'#2563eb',L2:'#16a34a',L3:'#dc2626',L4:'#ea580c',L5:'#7c3aed',F1:'#0891b2',F2:'#db2777',F3:'#92400e',F4:'#475569'};
  const LINE_OFFSETS={L1:-12,L2:-6,L3:0,L4:6,L5:12,F1:-12,F2:-6,F3:6,F4:12};
  let map=null,routes=[],buses=[],userMarker=null,userLatLng=null;const markers=new Map(),routeLayers=new Map();
  const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const colorForRoute=r=>LINE_COLORS[r?.line_code]||'#334155';const routeName=r=>r?.variant?`${r.route_name||'Route'} · ${r.variant}`:(r?.route_name||'Route');
  const hav=(a,b,c,d)=>{const R=6371000,p=Math.PI/180,da=(c-a)*p,db=(d-b)*p,x=Math.sin(da/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
  const formatKm=m=>Number.isFinite(Number(m))?`${(Number(m)/1000).toFixed(1)} km`:'—';
  const busOnline=b=>b?.is_active===true&&b.last_seen&&(Date.now()-new Date(b.last_seen).getTime()<60000);
  function geometryCoords(r){const g=r?.road_geometry;if(!g)return[];if(g.type==='Feature')return g.geometry?.coordinates||[];if(g.type==='LineString')return g.coordinates||[];return[]}
  function latLngs(r){return geometryCoords(r).map(c=>[Number(c[1]),Number(c[0])]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]))}
  function offsetLatLngs(points,meters){if(!meters||points.length<2)return points;const lat0=points.reduce((s,p)=>s+p[0],0)/points.length*Math.PI/180,mLat=111320,mLng=Math.max(1000,111320*Math.cos(lat0)),xy=points.map(p=>({x:p[1]*mLng,y:p[0]*mLat}));return xy.map((p,i)=>{const a=xy[Math.max(0,i-1)],b=xy[Math.min(xy.length-1,i+1)],dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;return[(p.y+ny*meters)/mLat,(p.x+nx*meters)/mLng]})}
  function showError(msg){$('mapError').textContent=msg;$('mapError').style.display='block'}
  function initMap(){if(!window.L)throw new Error('Leaflet failed to load.');map=L.map('map',{preferCanvas:true}).setView([18.04,-63.06],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);setTimeout(()=>map.invalidateSize(),200)}
  function routeForBus(b){const id=Number(b?.route_id);if(Number.isFinite(id)){const x=routes.find(r=>Number(r.id)===id);if(x)return x}return routes.find(r=>r.line_code===b?.line_code&&r.variant===b?.variant&&r.direction===b?.direction)||null}
  function drawRoutes(){for(const l of routeLayers.values())map.removeLayer(l);routeLayers.clear();const all=[];for(const r of routes){const pts=latLngs(r);if(pts.length<2)continue;const color=colorForRoute(r),dp=offsetLatLngs(pts,LINE_OFFSETS[r.line_code]??0),halo=L.polyline(dp,{color:'#fff',weight:9,opacity:.92,interactive:false}),line=L.polyline(dp,{color,weight:5,opacity:.9,lineCap:'round',lineJoin:'round'});const group=L.layerGroup([halo,line]).addTo(map);line.bindTooltip(esc(routeName(r)),{sticky:true});line.bindPopup(`<div class="popup-title" style="color:${color}">${esc(routeName(r))}</div><div class="popup-meta">${esc(r.direction||'')}<br>${esc(r.origin||'')} → ${esc(r.destination||'')}<br>Distance: ${formatKm(r.road_distance_meters)}</div>`);routeLayers.set(r.id,group);all.push(...dp)}if(all.length)try{map.fitBounds(L.latLngBounds(all).pad(0.05))}catch(e){}}
  function buildLegend(){const el=$('legend'),seen=new Set();el.innerHTML='';routes.forEach(r=>{const code=r.line_code||`L${r.line_number||''}`;if(seen.has(code))return;seen.add(code);const d=document.createElement('div');d.className='legend-item';d.innerHTML=`<span class="dot" style="background:${colorForRoute(r)}"></span>${esc(code)}${r.line_number?` — Line ${esc(r.line_number)}`:''}`;el.appendChild(d)})}
  function busIcon(b,r){const color=r?colorForRoute(r):'#475569',label=esc((b.bus_id||'?').replace(/^BUS_/i,''));return L.divIcon({className:'',iconSize:[48,34],iconAnchor:[24,17],html:`<div style="width:48px;height:30px;border-radius:9px;border:3px solid white;background:${color};box-shadow:0 2px 9px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:11px">🚌 ${label}</div>`})}
  function refreshBusMarkers(){const active=new Set();buses.forEach(b=>{const lat=Number(b.latitude),lng=Number(b.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;const id=b.bus_id||String(b.id);active.add(id);const r=routeForBus(b),color=r?colorForRoute(r):'#475569',icon=busIcon(b,r);let m=markers.get(id);if(!m){m=L.marker([lat,lng],{icon,zIndexOffset:1000}).addTo(map);markers.set(id,m)}else{m.setLatLng([lat,lng]);m.setIcon(icon)}m.bindPopup(`<div class="popup-title" style="color:${color}">${esc(id)}</div><div class="popup-meta">${esc(r?routeName(r):'No route')}<br>${esc(r?.direction||b.direction||'')}<br>Speed: ${Number.isFinite(Number(b.speed))?(Number(b.speed)*3.6).toFixed(0)+' km/h':'—'}<br>Last update: ${b.last_seen?new Date(b.last_seen).toLocaleTimeString():''}</div>`)});for(const [id,m] of markers){if(!active.has(id)){map.removeLayer(m);markers.delete(id)}}}
  function nearestPointOnRoute(lat,lng,r){const pts=latLngs(r);if(pts.length<2)return{distance:Infinity,progress:0};let best={distance:Infinity,progress:0},cum=0;for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],lat0=((a[0]+b[0])/2)*Math.PI/180,mx=111320*Math.cos(lat0),my=111320,ax=a[1]*mx,ay=a[0]*my,bx=b[1]*mx,by=b[0]*my,px=lng*mx,py=lat*my,dx=bx-ax,dy=by-ay,len2=dx*dx+dy*dy;let t=len2?((px-ax)*dx+(py-ay)*dy)/len2:0;t=Math.max(0,Math.min(1,t));const qx=ax+t*dx,qy=ay+t*dy,d=hav(lat,lng,qy/my,qx/mx),seg=hav(a[0],a[1],b[0],b[1]);if(d<best.distance)best={distance:d,progress:cum+t*seg};cum+=seg}return best}
  function etaForBus(bus,r){if(!userLatLng)return null;const p=nearestPointOnRoute(userLatLng[0],userLatLng[1],r),bp=Number(bus.route_progress_meters);if(!Number.isFinite(bp)||p.distance>500)return null;const delta=p.progress-bp;if(delta<=-100)return null;const speed=Math.max(4,Math.min(16,Number(bus.speed)||7));return{minutes:Math.max(0.5,delta/speed/60),distance:Math.max(0,delta),pickupDistance:p.distance}}
  function renderResults(){const el=$('busResults');if(!userLatLng){el.innerHTML='<div class="small" style="margin-top:8px">Tap “Use My Location” to find buses approaching your position.</div>';$('nearbyHint').textContent='Allow location for ETAs';return}const candidates=[];for(const b of buses){if(!busOnline(b))continue;const r=routeForBus(b);if(!r)continue;const eta=etaForBus(b,r);if(eta)candidates.push({b,r,eta})}candidates.sort((a,b)=>a.eta.minutes-b.eta.minutes);$('nearbyHint').textContent=candidates.length?`${candidates.length} approaching bus${candidates.length===1?'':'es'}`:'No approaching buses yet';if(!candidates.length){el.innerHTML='<div class="small" style="margin-top:8px">No active bus is currently approaching your location. Try again when your GPS is accurate.</div>';return}el.innerHTML=candidates.slice(0,8).map(x=>{const c=colorForRoute(x.r),mins=x.eta.minutes<1?'<1':Math.round(x.eta.minutes);return `<div class="bus"><div class="bus-main"><div class="bus-id" style="color:${c}">${esc(x.b.bus_id||'Bus')}</div><div class="bus-route">${esc(routeName(x.r))}<br>${esc(x.r.direction||'')}</div></div><div class="eta">${mins}<span>min ETA</span></div></div>`}).join('')}
  async function loadData(){const [rr,bb]=await Promise.all([db.from('routes').select('id,route_name,direction,region,line_number,line_code,variant,origin,destination,road_geometry,road_distance_meters,road_duration_seconds,active').eq('active',true),db.from('bus_locations').select('*').order('bus_id')]);if(rr.error)throw rr.error;if(bb.error)throw bb.error;routes=rr.data||[];buses=bb.data||[];routes.sort((a,b)=>String(a.region||'').localeCompare(String(b.region||''))||Number(a.line_number||999)-Number(b.line_number||999)||String(a.variant||'').localeCompare(String(b.variant||'')));buildLegend();drawRoutes();refreshBusMarkers();renderResults()}
  function requestLocation(){const status=$('gpsStatus');if(!navigator.geolocation){status.textContent='GPS is not supported';return}status.textContent='Requesting GPS…';navigator.geolocation.getCurrentPosition(pos=>{userLatLng=[pos.coords.latitude,pos.coords.longitude];status.textContent=`GPS ±${Math.round(pos.coords.accuracy)} m`;if(userMarker)map.removeLayer(userMarker);userMarker=L.marker(userLatLng,{title:'Your location'}).addTo(map).bindPopup('You are here').openPopup();map.setView(userLatLng,15,{animate:true});renderResults()},err=>{status.textContent=err.message||'Could not get location'},{enableHighAccuracy:true,timeout:10000,maximumAge:10000})}
  try{initMap()}catch(e){console.error(e);showError(e.message)}
  $('locateBtn').onclick=requestLocation;
  loadData().catch(e=>{console.error(e);showError('Could not load live data: '+(e.message||e));});
  setInterval(()=>loadData().catch(e=>{console.error(e);showError('Live update error: '+(e.message||e));}),5000);
  window.addEventListener('resize',()=>map&&map.invalidateSize());
})();
</script>
</body>
</html>
